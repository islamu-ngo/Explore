<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ISLAMU typographic logo</title>
  <desc id="desc">Typographic logo with Islamic aligned to the left edge and Software aligned to the right edge of ISLAMU.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <style>
      .text-logo {
        font-family: 'Inter', 'Montserrat', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
        fill: #000000;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- 1. Top text: Islamic (flush with start of ISLAMU) -->
  <text
    x="260"
    y="270"
    text-anchor="start"
    font-size="120"
    font-weight="300"
    letter-spacing="4"
    class="text-logo">Islamic</text>

  <!-- 2. Main Text: ISLAMU -->
  <text
    x="260"
    y="460"
    text-anchor="start"
    font-size="210"
    font-weight="800"
    letter-spacing="34"
    class="text-logo">ISLAMU</text>

  <!-- 3. Bottom text: Software (pulled further right to x="1275" to hit the outer edge of U) -->
  <text
    x="1235"
    y="650"
    text-anchor="end"
    font-size="120"
    font-weight="300"
    letter-spacing="4"
    class="text-logo">Software</text>
</svg>
