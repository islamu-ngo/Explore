# ABOUTME: Runs the standalone host with durable SQLite primary and privacy-authority files.
# ABOUTME: Orders ownership-safe volume initialization, migration, and one replica of the web host.

name: islamu-event-standalone

# PostgreSQL override: set these values in .env before `docker compose -f docker-compose.standalone.yml up`.
# DATABASE_PROVIDER=PostgreSql
# DATABASE_HOST=postgres.example.internal
# DATABASE_PORT=5432
# DATABASE_NAME=islamu_event
# DATABASE_SCHEMA=islamu_event
# DATABASE_RUNTIME_USERNAME=islamu_event_runtime
# DATABASE_RUNTIME_PASSWORD=<runtime-password>
# DATABASE_MIGRATOR_USERNAME=islamu_event_migrator
# DATABASE_MIGRATOR_PASSWORD=<migrator-password>

services:
  volume-init:
    image: busybox:1.37.0-musl
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown 1654:1654 /app/data && chmod 700 /app/data"]
    volumes:
      - event_standalone_data:/app/data

  event-migrationservice:
    build:
      context: .
      dockerfile: src/Event.MigrationService/Dockerfile
      target: final
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: ${DATABASE_PROVIDER:-Sqlite}
      Database__Host: ${DATABASE_HOST:-}
      Database__Port: ${DATABASE_PORT:-}
      Database__Database: ${DATABASE_NAME:-/app/data/event.db}
      Database__Schema: ${DATABASE_SCHEMA:-islamu_event}
      Database__TlsMode: ${DATABASE_TLS_MODE:-}
      Database__TrustServerCertificate: ${DATABASE_TRUST_SERVER_CERTIFICATE:-false}
      Database__Migrator__Username: ${DATABASE_MIGRATOR_USERNAME:-}
      Database__Migrator__Password: ${DATABASE_MIGRATOR_PASSWORD:-}
      PrivacyErasure__Authority__Topology: EmbeddedSqlite
      PrivacyErasureAuthorityEmbedded__Path: /app/data/privacy_erasure_authority.db
      PrivacyErasureAuthorityEmbedded__WriterReplicaCount: "1"
      PrivacyErasureAuthorityEmbedded__BusyTimeoutSeconds: "30"
    volumes:
      - event_standalone_data:/app/data
    depends_on:
      volume-init:
        condition: service_completed_successfully

  event-standalone:
    build:
      context: .
      dockerfile: src/Event.Standalone/Dockerfile
      target: final
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: ${DATABASE_PROVIDER:-Sqlite}
      Database__Host: ${DATABASE_HOST:-}
      Database__Port: ${DATABASE_PORT:-}
      Database__Database: ${DATABASE_NAME:-/app/data/event.db}
      Database__Schema: ${DATABASE_SCHEMA:-islamu_event}
      Database__TlsMode: ${DATABASE_TLS_MODE:-}
      Database__TrustServerCertificate: ${DATABASE_TRUST_SERVER_CERTIFICATE:-false}
      Database__Runtime__Username: ${DATABASE_RUNTIME_USERNAME:-}
      Database__Runtime__Password: ${DATABASE_RUNTIME_PASSWORD:-}
      PrivacyErasure__Authority__Topology: EmbeddedSqlite
      PrivacyErasureAuthorityEmbedded__Path: /app/data/privacy_erasure_authority.db
      PrivacyErasureAuthorityEmbedded__WriterReplicaCount: "1"
      PrivacyErasureAuthorityEmbedded__BusyTimeoutSeconds: "30"
      Hosting__ReplicaCount: "1"
    ports:
      - "${EVENT_STANDALONE_HTTP_PORT:-8080}:8080"
    volumes:
      - event_standalone_data:/app/data
    deploy:
      replicas: 1
    depends_on:
      event-migrationservice:
        condition: service_completed_successfully

volumes:
  event_standalone_data:
