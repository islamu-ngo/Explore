# ABOUTME: Cerbos resource policy for instance-level settings.
# Only instance admins can view and modify instance settings.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "instance_setting"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything with instance settings
    - actions: ["view", "update", "delete", "lock", "unlock"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # All authenticated users can view instance settings (read-only)
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
