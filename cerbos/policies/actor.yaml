# ABOUTME: Cerbos resource policy for actor resources.
# Actors are system-managed (created via user/org registration). Read-only for most users.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "actor"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage actors within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # Org admins can view actors for their organization
    - actions: ["view"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_admin

    # All authenticated users can view actors
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
