# ABOUTME: Cerbos resource policy for event_registration resources.
# ABOUTME: Allows persisted registration owners to cancel without granting attendee approval updates.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_event_registration"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_event_registration.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage all registrations within their tenant
    - actions: ["view", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Org admins can manage registrations for their events
    - actions: ["view", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin

    # Event owners can manage registrations for their event
    - actions: ["view", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_owner

    # Event managers can view and update registrations for their event
    - actions: ["view", "update"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_manager

    # Registration managers can view and update registrations for their event
    - actions: ["view", "update"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_registration_manager

    # All authenticated users can create registrations (register for events)
    - actions: ["create", "view"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user

    - actions: ["delete"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            has(request.resource.attr.tenantId) &&
            has(request.resource.attr.userId) &&
            has(request.principal.attr.userId) &&
            request.resource.attr.userId == request.principal.attr.userId &&
            (!has(request.principal.attr.is_machine) ||
             request.principal.attr.is_machine != true)
