# ABOUTME: Cerbos resource policy for event_registration resources.
# Event registrations: org admins manage registrations, users can register themselves.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_event_registration"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_event_registration.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage all registrations within their tenant
    - actions: ["view", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Org admins can manage registrations for their events
    - actions: ["view", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin

    # All authenticated users can create registrations (register for events)
    - actions: ["create", "view"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
