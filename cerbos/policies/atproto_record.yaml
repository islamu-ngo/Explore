# ABOUTME: Cerbos resource policy for atproto_record resources.
# ATProto records are system/admin resources: instance admins write, users read.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "atproto_record"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # All authenticated users can view ATProto records
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
