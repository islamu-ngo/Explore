# ABOUTME: Cerbos resource policy for location_room resources.
# Rooms are location-scoped: tenant admins manage rooms within their tenant.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "location_room"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///location_room.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage all rooms within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # Org admins can manage rooms for their locations
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_admin

    # All authenticated users can view rooms
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
