# ABOUTME: Cerbos resource policy for tenant resources.
# Tenants: instance admins manage all, tenant admins manage their own tenant.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "tenant"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can view and update their own tenant
    - actions: ["view", "update"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # All authenticated users can view tenants
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
