# ABOUTME: Cerbos resource policy for indexed_did resources.
# Indexed DIDs are system/admin resources: instance admins write, users read.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "indexed_did"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///indexed_did.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # All authenticated users can view indexed DIDs
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
