# ABOUTME: Cerbos resource policy for event_contact_share_consent resources.
# Controls who can view and export shared contact emails from consented registrants.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "event_contact_share_consent"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can view and export shared contacts
    - actions: ["viewsharedcontacts", "exportsharedcontacts"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # Org admins can view and export shared contacts for their organisation
    - actions: ["viewsharedcontacts", "exportsharedcontacts"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_admin
