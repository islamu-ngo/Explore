# ABOUTME: Cerbos resource policy for tenant_user resources.
# Tenant users: instance admins manage all, tenant admins manage users in their tenant.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "tenant_user"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage tenant users within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # All authenticated users can view tenant users
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
