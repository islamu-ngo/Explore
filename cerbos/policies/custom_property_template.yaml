# ABOUTME: Cerbos resource policy for custom_property_template resources.
# ABOUTME: Template CRUD and sync operations are tenant-scoped; tenant admins manage, all authenticated can view.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "custom_property_template"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///custom_property_template.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage templates within their tenant (CRUD + sync)
    - actions: ["view", "create", "update", "delete", "sync_diff", "sync_apply"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # All authenticated users can view templates
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
