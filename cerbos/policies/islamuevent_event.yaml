# ABOUTME: Cerbos resource policy for event resources.
# Events are org-scoped: org admins manage their events, tenant admins manage all events in their tenant.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_event"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_event.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can manage all events within their tenant
    - actions: ["view", "create", "update", "delete", "publish", "manage-team", "manage-owner", "transfer-ownership", "manage-finance"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    # Org admins can manage events for their organization
    - actions: ["view", "create", "update", "delete", "publish", "manage-team", "manage-owner", "transfer-ownership", "manage-finance"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin

    # Event creation is a pre-create check: the event actor does not exist yet.
    # The CreateEventCommand handler still enforces tenant user-submission policy
    # and organization/group EventCreate membership before persisting the event.
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            has(request.resource.attr.authorizationPhase) &&
            request.resource.attr.authorizationPhase == "pre_create" &&
            (!has(request.principal.attr.is_machine) ||
            request.principal.attr.is_machine != true)

    # Event owners have full control over their event
    - actions: ["view", "update", "delete", "publish", "manage-team", "manage-owner", "transfer-ownership", "manage-finance"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_owner

    # Event managers can edit and publish their event
    - actions: ["view", "update", "publish"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_manager

    # All authenticated users can view public events
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
