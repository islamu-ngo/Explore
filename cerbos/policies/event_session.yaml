# ABOUTME: Cerbos resource policy for event_session resources.
# Event sessions are org-scoped: org admins manage their event sessions.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "event_session"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///event_session.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage all event sessions within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # Org admins can manage event sessions for their organization
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_admin

    # All authenticated users can view event sessions
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
