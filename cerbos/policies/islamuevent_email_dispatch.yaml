# ABOUTME: Cerbos resource policy for EmailDispatch operator resources.
# ABOUTME: Protects replay and parking affordances behind tenant-admin operator authority.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_email_dispatch"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_email_dispatch.json
  rules:
    # Instance admins can do everything.
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    # Tenant admins can view status and operate replay/park within their tenant.
    - actions: ["view", "update"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin
