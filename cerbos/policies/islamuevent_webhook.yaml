# ABOUTME: Cerbos resource policy for outgoing webhook management and provider portal actions.
# ABOUTME: Grants tenant admins tenant scope and org admins delegated org-owned webhook scope.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_webhook"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_webhook.json
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    - actions:
        - "webhook:view"
        - "webhook:create"
        - "webhook:update"
        - "webhook:delete"
        - "webhook:rotate-secret"
        - "webhook:test"
        - "webhook:retry"
        - "webhook:resume"
        - "webhook:view-delivery"
        - "webhook:manage-provider"
        - "webhook:open-provider-portal"
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin

    - actions:
        - "webhook:view"
        - "webhook:create"
        - "webhook:update"
        - "webhook:delete"
        - "webhook:rotate-secret"
        - "webhook:test"
        - "webhook:retry"
        - "webhook:resume"
        - "webhook:view-delivery"
        - "webhook:open-provider-portal"
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_org_admin
      condition:
        match:
          expr: >
            has(request.resource.attr.allowOrganizationWebhooks) &&
            request.resource.attr.allowOrganizationWebhooks == true
