# ABOUTME: Cerbos resource policy for outgoing webhook management and provider portal actions.
# ABOUTME: Grants webhook administration to instance admins and tenant admins for their tenant scope.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_webhook"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_webhook.json
  rules:
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_instance_admin

    - actions:
        - "webhook:view"
        - "webhook:create"
        - "webhook:update"
        - "webhook:delete"
        - "webhook:rotate-secret"
        - "webhook:test"
        - "webhook:retry"
        - "webhook:view-delivery"
        - "webhook:manage-provider"
        - "webhook:open-provider-portal"
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_tenant_admin
