# ABOUTME: Cerbos resource policy for organization resources.
# Org admins manage their organizations; tenant admins manage all orgs within their tenant.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "organization"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage all organizations within their tenant
    - actions: ["view", "update", "delete", "manage_members"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # Org admins can manage their own organization
    - actions: ["view", "update", "manage_members"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_admin

    # All authenticated users can view organizations
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
