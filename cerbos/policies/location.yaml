# ABOUTME: Cerbos resource policy for location resources.
# Locations are tenant-scoped: tenant admins manage, users can view.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "location"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///location.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage locations within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # All authenticated users can view locations
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
