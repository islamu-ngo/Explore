# ABOUTME: Cerbos resource policy for custom_property_definition resources.
# Custom property definitions are tenant-scoped: tenant admins manage, all authenticated can view.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "custom_property_definition"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///custom_property_definition.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage custom property definitions within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # All authenticated users can view custom property definitions
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
