# ABOUTME: Cerbos policy for event ticket authoring through the parent event authority boundary.
# ABOUTME: Denies tenant and machine authority; verified organizers and event managers may manage tickets.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "islamuevent_event_ticket_type"
  version: "default"
  importDerivedRoles:
    - islamuevent_explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///islamuevent_principal.json
    resourceSchema:
      ref: cerbos:///islamuevent_event_ticket_type.json
  rules:
    - actions: ["manage-tickets"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - islamuevent_event_owner
        - islamuevent_event_manager
      condition:
        match:
          expr: >
            request.principal.attr.isInstanceAdmin != true &&
            !(request.resource.attr.tenantId in request.principal.attr.tenantMemberships) &&
            (!has(request.principal.attr.is_machine) || request.principal.attr.is_machine != true)
    - actions: ["manage-tickets"]
      effect: EFFECT_ALLOW
      roles:
        - islamuevent_authenticated_user
      condition:
        match:
          expr: >
            request.principal.attr.isInstanceAdmin != true &&
            !(request.resource.attr.tenantId in request.principal.attr.tenantMemberships) &&
            (!has(request.principal.attr.is_machine) || request.principal.attr.is_machine != true) &&
            ((has(request.resource.attr.organizerUserId) && has(request.principal.attr.userId) && request.resource.attr.organizerUserId == request.principal.attr.userId) ||
             (has(request.resource.attr.organizerOrganizationId) && has(request.principal.attr.eventCreateOrganizations) && request.resource.attr.organizerOrganizationId in request.principal.attr.eventCreateOrganizations) ||
             (has(request.resource.attr.organizerGroupId) && has(request.principal.attr.eventCreateGroups) && request.resource.attr.organizerGroupId in request.principal.attr.eventCreateGroups))
