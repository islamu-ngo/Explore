# ABOUTME: Cerbos resource policy for group_member resources.
# Group members are org-scoped: org admins manage membership, all authenticated can view and join.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "group_member"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  schemas:
    principalSchema:
      ref: cerbos:///principal.json
    resourceSchema:
      ref: cerbos:///group_member.json
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage all group members within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # Org admins can manage group members for their organization
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_admin

    # All authenticated users can view and create (join) group memberships
    - actions: ["view", "create"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
