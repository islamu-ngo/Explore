# ABOUTME: Cerbos resource policy for tag resources.
# Tags are tenant-scoped lookup data: tenant admins manage, users can view.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "tag"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage tags within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # All authenticated users can view tags
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
