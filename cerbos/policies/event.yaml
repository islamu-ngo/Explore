# ABOUTME: Cerbos resource policy for event resources.
# Events are org-scoped: org admins manage their events, tenant admins manage all events in their tenant.

apiVersion: api.cerbos.dev/v1
resourcePolicy:
  resource: "event"
  version: "default"
  importDerivedRoles:
    - explore_admin_roles
  rules:
    # Instance admins can do everything
    - actions: ["*"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - instance_admin

    # Tenant admins can manage all events within their tenant
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - tenant_admin

    # Org admins can manage events for their organization
    - actions: ["view", "create", "update", "delete"]
      effect: EFFECT_ALLOW
      derivedRoles:
        - org_admin

    # All authenticated users can view public events
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles:
        - authenticated_user
