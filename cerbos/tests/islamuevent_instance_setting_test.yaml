# ABOUTME: Cerbos policy test suite for instance_setting resources.
# ABOUTME: Validates storage administration affordances for instance-level settings.

name: InstanceSettingPolicyTests
description: "Validates instance_setting storage administration authority and read-only authenticated access"

principals:
  islamuevent_instance_admin:
    id: "user-instance-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: true
      tenantMemberships: {}
      orgMemberships: {}

  islamuevent_tenant_admin:
    id: "user-tenant-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-1": "admin"
      orgMemberships: {}

  regular_user:
    id: "user-regular"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

resources:
  storage_setting:
    kind: "islamuevent_instance_setting"
    id: "storage"
    attr:
      settingKey: "storage"

tests:
  - name: "Instance admin can fully manage instance storage settings"
    input:
      principals: ["islamuevent_instance_admin"]
      resources: ["storage_setting"]
      actions: ["view", "update", "delete", "lock", "unlock"]
    expected:
      - principal: "islamuevent_instance_admin"
        resource: "storage_setting"
        actions:
          view: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW
          lock: EFFECT_ALLOW
          unlock: EFFECT_ALLOW

  - name: "Tenant admin can only view instance storage settings"
    input:
      principals: ["islamuevent_tenant_admin"]
      resources: ["storage_setting"]
      actions: ["view", "update", "delete", "lock", "unlock"]
    expected:
      - principal: "islamuevent_tenant_admin"
        resource: "storage_setting"
        actions:
          view: EFFECT_ALLOW
          update: EFFECT_DENY
          delete: EFFECT_DENY
          lock: EFFECT_DENY
          unlock: EFFECT_DENY

  - name: "Regular authenticated users can only view instance storage settings"
    input:
      principals: ["regular_user"]
      resources: ["storage_setting"]
      actions: ["view", "update"]
    expected:
      - principal: "regular_user"
        resource: "storage_setting"
        actions:
          view: EFFECT_ALLOW
          update: EFFECT_DENY
