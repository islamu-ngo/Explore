# ABOUTME: Cerbos policy test suite for storage_object resources.
# ABOUTME: Covers authenticated upload-session creation and tenant-scoped management.

name: StorageObjectPolicyTests
description: "Validates storage_object upload and tenant management permissions"

principals:
  islamuevent_instance_admin:
    id: "user-instance-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: true
      tenantMemberships: {}
      orgMemberships: {}

  islamuevent_tenant_admin:
    id: "user-tenant-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-1": "admin"
      orgMemberships: {}

  unrelated_tenant_admin:
    id: "user-unrelated-tenant"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-other": "admin"
      orgMemberships: {}

  regular_user:
    id: "user-regular"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

resources:
  event_image_upload_session:
    kind: "islamuevent_storage_object"
    id: "event-image-upload"
    attr:
      tenantId: "tenant-1"
      owningResourceKind: "islamuevent_event"
      owningResourceId: "event-1"
      purpose: "event_image"
      visibility: "public_image"

tests:
  - name: "Instance admin can manage storage objects"
    input:
      principals: ["islamuevent_instance_admin"]
      resources: ["event_image_upload_session"]
      actions: ["view", "create", "update", "delete"]
    expected:
      - principal: "islamuevent_instance_admin"
        resource: "event_image_upload_session"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW

  - name: "Tenant admin can manage storage objects in their tenant"
    input:
      principals: ["islamuevent_tenant_admin"]
      resources: ["event_image_upload_session"]
      actions: ["view", "create", "update", "delete"]
    expected:
      - principal: "islamuevent_tenant_admin"
        resource: "event_image_upload_session"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW

  - name: "Regular authenticated user can create upload sessions but cannot mutate storage records"
    input:
      principals: ["regular_user"]
      resources: ["event_image_upload_session"]
      actions: ["view", "create", "update", "delete"]
    expected:
      - principal: "regular_user"
        resource: "event_image_upload_session"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: "Unrelated tenant admin cannot update or delete another tenant storage object"
    input:
      principals: ["unrelated_tenant_admin"]
      resources: ["event_image_upload_session"]
      actions: ["update", "delete"]
    expected:
      - principal: "unrelated_tenant_admin"
        resource: "event_image_upload_session"
        actions:
          update: EFFECT_DENY
          delete: EFFECT_DENY
