# ABOUTME: Cerbos policy test suite for event resources.
# Tests the 3-level admin hierarchy: instance_admin > tenant_admin > org_admin > authenticated_user.

name: EventPolicyTests
description: "Validates event resource policies across all admin hierarchy levels"

principals:
  instance_admin:
    id: "user-instance-admin"
    roles: ["authenticated_user"]
    attr:
      isInstanceAdmin: true
      tenantMemberships: {}
      orgMemberships: {}

  tenant_admin:
    id: "user-tenant-admin"
    roles: ["authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-1": "admin"
      orgMemberships: {}

  org_admin:
    id: "user-org-admin"
    roles: ["authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships:
        "org-1": "admin"

  regular_user:
    id: "user-regular"
    roles: ["authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

  unrelated_tenant_admin:
    id: "user-unrelated-tenant"
    roles: ["authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-other": "admin"
      orgMemberships: {}

  unrelated_org_admin:
    id: "user-unrelated-org"
    roles: ["authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships:
        "org-other": "admin"

resources:
  event_in_tenant1_org1:
    kind: "event"
    id: "event-1"
    attr:
      tenantId: "tenant-1"
      organizationId: "org-1"

tests:
  - name: "Instance admin can do everything on events"
    input:
      principals: ["instance_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view", "create", "update", "delete"]
    expected:
      - principal: "instance_admin"
        resource: "event_in_tenant1_org1"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW

  - name: "Tenant admin can manage events in their tenant"
    input:
      principals: ["tenant_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view", "create", "update", "delete"]
    expected:
      - principal: "tenant_admin"
        resource: "event_in_tenant1_org1"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW

  - name: "Org admin can manage events for their organization"
    input:
      principals: ["org_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view", "create", "update", "delete"]
    expected:
      - principal: "org_admin"
        resource: "event_in_tenant1_org1"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_ALLOW
          update: EFFECT_ALLOW
          delete: EFFECT_ALLOW

  - name: "Regular user can only view events"
    input:
      principals: ["regular_user"]
      resources: ["event_in_tenant1_org1"]
      actions: ["view", "create", "update", "delete"]
    expected:
      - principal: "regular_user"
        resource: "event_in_tenant1_org1"
        actions:
          view: EFFECT_ALLOW
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: "Unrelated tenant admin cannot manage events in different tenant"
    input:
      principals: ["unrelated_tenant_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["create", "update", "delete"]
    expected:
      - principal: "unrelated_tenant_admin"
        resource: "event_in_tenant1_org1"
        actions:
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY

  - name: "Unrelated org admin cannot manage events in different org"
    input:
      principals: ["unrelated_org_admin"]
      resources: ["event_in_tenant1_org1"]
      actions: ["create", "update", "delete"]
    expected:
      - principal: "unrelated_org_admin"
        resource: "event_in_tenant1_org1"
        actions:
          create: EFFECT_DENY
          update: EFFECT_DENY
          delete: EFFECT_DENY
