# ABOUTME: Cerbos policy tests for persisted event-registration ownership and manager authority.
# ABOUTME: Proves attendee cancellation without attendee approval-update permission or tenant leakage.

name: EventRegistrationPolicyTests
description: "Validates owner cancellation and registration-management boundaries"

principals:
  registration_owner:
    id: "subject-owner"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-attendee"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

  other_attendee:
    id: "subject-other"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-other"
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

  machine_registration_owner:
    id: "machine-owner"
    roles: ["islamuevent_authenticated_user"]
    attr:
      userId: "user-attendee"
      is_machine: true
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}

  registration_manager:
    id: "subject-registration-manager"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships: {}
      eventAssignments:
        "event-1":
          tenantId: "tenant-1"
          roles: ["event.registration_manager"]
          permissions: ["event_registration:view", "event_registration:manage"]

  organization_admin:
    id: "subject-organization-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships: {}
      orgMemberships:
        "organization-1": "admin"

  tenant_admin:
    id: "subject-tenant-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-1": "admin"
      orgMemberships: {}

  other_tenant_admin:
    id: "subject-other-tenant-admin"
    roles: ["islamuevent_authenticated_user"]
    attr:
      isInstanceAdmin: false
      tenantMemberships:
        "tenant-2": "admin"
      orgMemberships: {}

resources:
  attendee_registration:
    kind: "islamuevent_event_registration"
    id: "registration-1"
    attr:
      tenantId: "tenant-1"
      eventId: "event-1"
      eventSessionId: "session-1"
      userId: "user-attendee"
      organizationId: "organization-1"

tests:
  - name: "Persisted registration owner can cancel but cannot update approval"
    input:
      principals: ["registration_owner"]
      resources: ["attendee_registration"]
      actions: ["delete", "update"]
    expected:
      - principal: "registration_owner"
        resource: "attendee_registration"
        actions:
          delete: EFFECT_ALLOW
          update: EFFECT_DENY

  - name: "Different attendee and machine owner cannot cancel or update"
    input:
      principals: ["other_attendee", "machine_registration_owner"]
      resources: ["attendee_registration"]
      actions: ["delete", "update"]
    expected:
      - principal: "other_attendee"
        resource: "attendee_registration"
        actions:
          delete: EFFECT_DENY
          update: EFFECT_DENY
      - principal: "machine_registration_owner"
        resource: "attendee_registration"
        actions:
          delete: EFFECT_DENY
          update: EFFECT_DENY

  - name: "Registration manager can update but cannot cancel"
    input:
      principals: ["registration_manager"]
      resources: ["attendee_registration"]
      actions: ["delete", "update"]
    expected:
      - principal: "registration_manager"
        resource: "attendee_registration"
        actions:
          delete: EFFECT_DENY
          update: EFFECT_ALLOW

  - name: "Owning organization and tenant administrators preserve management authority"
    input:
      principals: ["organization_admin", "tenant_admin"]
      resources: ["attendee_registration"]
      actions: ["delete", "update"]
    expected:
      - principal: "organization_admin"
        resource: "attendee_registration"
        actions:
          delete: EFFECT_ALLOW
          update: EFFECT_ALLOW
      - principal: "tenant_admin"
        resource: "attendee_registration"
        actions:
          delete: EFFECT_ALLOW
          update: EFFECT_ALLOW

  - name: "Unrelated tenant administrator cannot manage registration"
    input:
      principals: ["other_tenant_admin"]
      resources: ["attendee_registration"]
      actions: ["delete", "update"]
    expected:
      - principal: "other_tenant_admin"
        resource: "attendee_registration"
        actions:
          delete: EFFECT_DENY
          update: EFFECT_DENY
