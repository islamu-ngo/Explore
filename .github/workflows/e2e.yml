# ABOUTME: Nightly and manual Aspire-backed Playwright E2E runtime lane.
# ABOUTME: Runs the browser suite outside required PR checks and retains failure artifacts.

name: E2E Runtime Tests

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Aspire-backed Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Restore .NET Tools
        run: dotnet tool restore

      - name: Build E2E test project
        run: >-
          dotnet build tests/Explore.Blazor.Client.E2ETests/Explore.Blazor.Client.E2ETests.csproj
          --configuration Release
          --no-restore
          --verbosity minimal

      - name: Install Playwright Chromium dependencies
        shell: bash
        run: |
          set -euo pipefail
          pwsh tests/Explore.Blazor.Client.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run Aspire-backed Playwright E2E tests
        id: e2e_tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e

          dotnet test --project tests/Explore.Blazor.Client.E2ETests/Explore.Blazor.Client.E2ETests.csproj \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            -- \
            --report-trx \
            --report-trx-filename Explore.Blazor.Client.E2ETests.trx \
            | tee artifacts/e2e/e2e-test.log

      - name: Capture Docker diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/e2e/docker

          docker ps -a > artifacts/e2e/docker/containers.txt || true
          docker images > artifacts/e2e/docker/images.txt || true

          while read -r container_id container_name; do
            [ -n "$container_id" ] || continue
            safe_name="${container_name//[^A-Za-z0-9_.-]/-}"
            docker logs "$container_id" > "artifacts/e2e/docker/${safe_name}.log" 2>&1 || true
          done < <(docker ps -a --format '{{.ID}} {{.Names}}' || true)

      - name: Write E2E Runtime Evidence Summary
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          E2E_OUTCOME: ${{ steps.e2e_tests.outcome }}
        run: |
          set -euo pipefail

          {
            echo "## E2E Runtime Evidence"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | ${EVENT_NAME} |"
            echo "| Ref | ${REF_NAME} |"
            echo "| Commit | ${COMMIT_SHA} |"
            echo "| E2E test outcome | ${E2E_OUTCOME} |"
            echo "| Artifact | e2e-runtime-evidence |"
            echo "| Test log | artifacts/e2e/e2e-test.log |"
            echo "| TRX | tests/Explore.Blazor.Client.E2ETests/bin/Release/net10.0/TestResults/**/*.trx |"
            echo "| Playwright artifacts | tests/Explore.Blazor.Client.E2ETests/bin/Release/net10.0/TestResults/playwright-artifacts/** |"
            echo "| Docker diagnostics | artifacts/e2e/docker/** |"
            echo "| Reliability inventory | docs/TEST_RELIABILITY.md |"
            echo
            echo "This lane remains manual/nightly until tracked reliability debt is resolved or explicitly baselined."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-runtime-evidence
          path: |
            artifacts/e2e/**
            tests/Explore.Blazor.Client.E2ETests/bin/Release/net10.0/TestResults/**/*.trx
            tests/Explore.Blazor.Client.E2ETests/bin/Release/net10.0/TestResults/playwright-artifacts/**
          if-no-files-found: warn
          retention-days: 30
