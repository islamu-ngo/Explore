# ABOUTME: Production CI/CD — builds Docker images and deploys to Coolify on push to main or version tags.
# ABOUTME: Uses change detection to only build/test/deploy API or UI when their source code changes.

name: Build and Deploy to Coolify (Production)

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      # AI / tool configuration directories
      - ".claude/**"
      - ".codex/**"
      - ".copilot/**"
      - ".gemini/**"
      - ".opencode/**"
      - ".repomix/**"
      - ".sisyphus/**"
      - ".taskmaster/**"
      # BMAD framework
      - "_bmad/**"
      - "_bmad-output/**"
      # Documentation & metadata
      - "docs/**"
      - "schemas/**"
      - "assets/**"
      - "dev/**"
      # Project management (Plane)
      - "event/**"
      # Cerbos policies (has own workflow)
      - "cerbos/**"
      # Local dev infrastructure
      - "docker/**"
      - "docker-compose.yml"
      - "Explore.AppHost/**"
      - "Event.Benchmarks/**"
      # Empty / unused directories
      - "amp/**"
      # Test projects (test-only changes don't affect deployed artifacts)
      - "Event.Application.UnitTests/**"
      - "Event.Domain.UnitTests/**"
      - "Event.Architecture.Tests/**"
      - "Event.Persistence.IntegrationTests/**"
      - "Event.API.IntegrationTests/**"
      - "Explore.Secrets.UnitTests/**"
      - "Explore.Blazor.Client.Tests/**"
      - "Explore.Blazor.IntegrationTests/**"
      - "Explore.Blazor.Client.E2ETests/**"
      # Markdown & root meta files
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
      - ".mcp.json"
      - "repomix.config.json"
      - "opencode.json"
      - "jean.json"
      # GitHub config (except this workflow)
      - ".github/**"
      - "!.github/workflows/_container-build.yml"
      - "!.github/workflows/deploy-coolify.yml"

env:
  REGISTRY: atcr.io
  REGISTRY_USER: amirakrari.bsky.social

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # JOB 1: Detect Changes
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      both_changed: ${{ steps.check-both.outputs.both_changed }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for file changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          base: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          filters: |
            ui:
              - 'Explore.Blazor/**'
              - 'Explore.Blazor.Client/**'
              - 'Explore.ServiceDefaults/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'Explore.sln'

            api:
              - 'Explore.API/**'
              - 'Explore.Application/**'
              - 'Explore.Domain/**'
              - 'Explore.Infrastructure/**'
              - 'Explore.Persistence/**'
              - 'Explore.Diagnostic/**'
              - 'Explore.Secrets/**'
              - 'Event.MigrationService/**'
              - 'Explore.ServiceDefaults/**'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'Explore.sln'

      - name: Check if both changed
        id: check-both
        run: |
          API="${{ steps.filter.outputs.api }}"
          UI="${{ steps.filter.outputs.ui }}"
          IS_TAG="${{ github.ref_type == 'tag' }}"

          # Both changed if: (api AND ui) OR it's a tag push
          if [ "$IS_TAG" == "true" ] || ([ "$API" == "true" ] && [ "$UI" == "true" ]); then
            echo "both_changed=true" >> $GITHUB_OUTPUT
          else
            echo "both_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Dynamic Build Matrix
        id: set-matrix
        run: |
          MATRIX_JSON="[]"

          if [ "${{ steps.filter.outputs.api }}" == "true" ] || [ "${{ github.ref_type }}" == "tag" ]; then
            MATRIX_JSON=$(echo $MATRIX_JSON | jq '. + [{"image-name": "islamu-event-api", "dockerfile": "Explore.API/Dockerfile", "context": "."}]')
          fi

          if [ "${{ steps.filter.outputs.ui }}" == "true" ] || [ "${{ github.ref_type }}" == "tag" ]; then
            MATRIX_JSON=$(echo $MATRIX_JSON | jq '. + [{"image-name": "islamu-event-ui", "dockerfile": "Explore.Blazor/Dockerfile", "context": "."}]')
          fi

          echo "matrix=$(echo $MATRIX_JSON | tr -d '\n')" >> $GITHUB_OUTPUT

  # JOB 2: Run Tests (Unified)
  run-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || github.ref_type == 'tag'
    uses: ./.github/workflows/_build-test.yml
    with:
      run-integration-tests: true
      configuration: Release

  # JOB 3: Build & Push
  build-and-push:
    needs: [detect-changes, run-tests]
    if: always() && needs.run-tests.result == 'success' && needs.detect-changes.outputs.matrix != '[]'
    uses: ./.github/workflows/_container-build.yml
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    with:
      image-name: ${{ matrix.image-name }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      registry: atcr.io
      registry-user: amirakrari.bsky.social
      build-configuration: Release
      metadata-tags: |
        type=raw,value=latest
        type=sha,prefix=sha-
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
    secrets:
      ATCR_PASSWORD: ${{ secrets.ATCR_PASSWORD }}

  # JOB 4: Deploy to Production
  deploy:
    needs: [detect-changes, build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Trigger Coolify Deployment (API)
        if: ${{ needs.detect-changes.outputs.api == 'true' || github.ref_type == 'tag' }}
        env:
          ENVIRONMENT_NAME: production
          COMPONENT: API
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_API_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail

          mkdir -p artifacts/deploy
          summary_file="artifacts/deploy/${ENVIRONMENT_NAME}-${COMPONENT}.md"
          response_file="/tmp/coolify-${ENVIRONMENT_NAME}-${COMPONENT}.txt"

          echo "::add-mask::${COOLIFY_WEBHOOK}"
          echo "::add-mask::${COOLIFY_TOKEN}"

          echo "Triggering ${COMPONENT} deployment for ${ENVIRONMENT_NAME}..."
          curl_status=0
          http_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 60 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request GET "${COOLIFY_WEBHOOK}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          )" || curl_status=$?

          if [[ "${curl_status}" -ne 0 ]]; then
            echo "Coolify webhook transport failed for ${COMPONENT}; curl exit ${curl_status}."
            {
              echo "## Deployment failed"
              echo
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Environment | ${ENVIRONMENT_NAME} |"
              echo "| Component | ${COMPONENT} |"
              echo "| Commit | \`${GITHUB_SHA}\` |"
              echo "| Coolify webhook | transport failure, curl exit ${curl_status} |"
            } | tee "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "Coolify webhook failed for ${COMPONENT}; HTTP ${http_code}."
            sed -E 's/(token|authorization|bearer|password|secret)[^[:space:]]*/[REDACTED]/Ig' "${response_file}" || true
            {
              echo "## Deployment failed"
              echo
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Environment | ${ENVIRONMENT_NAME} |"
              echo "| Component | ${COMPONENT} |"
              echo "| Commit | \`${GITHUB_SHA}\` |"
              echo "| Coolify webhook | failed, HTTP ${http_code} |"
            } | tee "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          smoke_status="skipped: URL not configured"
          if [[ -n "${SMOKE_BASE_URL:-}" ]]; then
            smoke_status="failed"
            for path in /alive /health; do
                for attempt in {1..10}; do
                smoke_code="$(
                  curl \
                    --silent \
                    --show-error \
                    --connect-timeout 10 \
                    --max-time 10 \
                    --output "/tmp/smoke-${ENVIRONMENT_NAME}-${COMPONENT}.txt" \
                    --write-out '%{http_code}' \
                    "${SMOKE_BASE_URL%/}${path}" || true
                )"

                if [[ "${smoke_code}" == "200" ]]; then
                  smoke_status="passed"
                  break
                fi

                if [[ "${attempt}" == "10" ]]; then
                  echo "Smoke check failed for ${COMPONENT}: ${SMOKE_BASE_URL%/}${path} returned HTTP ${smoke_code}."
                  sed -E 's/(token|authorization|bearer|password|secret)[^[:space:]]*/[REDACTED]/Ig' "/tmp/smoke-${ENVIRONMENT_NAME}-${COMPONENT}.txt" | head -c 4096 || true
                  {
                    echo "## Deployment failed"
                    echo
                    echo "| Field | Value |"
                    echo "|---|---|"
                    echo "| Environment | ${ENVIRONMENT_NAME} |"
                    echo "| Component | ${COMPONENT} |"
                    echo "| Commit | \`${GITHUB_SHA}\` |"
                    echo "| Coolify webhook | accepted, HTTP ${http_code} |"
                    echo "| Smoke check | failed at ${path}, HTTP ${smoke_code} |"
                  } | tee "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
                  exit 1
                fi

                sleep 10
              done
            done
          fi

          {
            echo "## Deployment"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | ${ENVIRONMENT_NAME} |"
            echo "| Component | ${COMPONENT} |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Coolify webhook | accepted, HTTP ${http_code} |"
            echo "| Smoke check | ${smoke_status} |"
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo
            echo "Rollback: redeploy the previous known-good Coolify deployment or retarget Coolify to the previous immutable image tag/digest per the release runbook."
          } | tee "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Trigger Coolify Deployment (UI)
        if: ${{ needs.detect-changes.outputs.ui == 'true' || github.ref_type == 'tag' }}
        env:
          ENVIRONMENT_NAME: production
          COMPONENT: UI
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_UI_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_UI_URL }}
        run: |
          set -euo pipefail

          mkdir -p artifacts/deploy
          summary_file="artifacts/deploy/${ENVIRONMENT_NAME}-${COMPONENT}.md"
          response_file="/tmp/coolify-${ENVIRONMENT_NAME}-${COMPONENT}.txt"

          echo "::add-mask::${COOLIFY_WEBHOOK}"
          echo "::add-mask::${COOLIFY_TOKEN}"

          echo "Triggering ${COMPONENT} deployment for ${ENVIRONMENT_NAME}..."
          curl_status=0
          http_code="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 60 \
              --output "${response_file}" \
              --write-out '%{http_code}' \
              --request GET "${COOLIFY_WEBHOOK}" \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          )" || curl_status=$?

          if [[ "${curl_status}" -ne 0 ]]; then
            echo "Coolify webhook transport failed for ${COMPONENT}; curl exit ${curl_status}."
            {
              echo "## Deployment failed"
              echo
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Environment | ${ENVIRONMENT_NAME} |"
              echo "| Component | ${COMPONENT} |"
              echo "| Commit | \`${GITHUB_SHA}\` |"
              echo "| Coolify webhook | transport failure, curl exit ${curl_status} |"
            } | tee "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          if [[ "${http_code}" -lt 200 || "${http_code}" -ge 300 ]]; then
            echo "Coolify webhook failed for ${COMPONENT}; HTTP ${http_code}."
            sed -E 's/(token|authorization|bearer|password|secret)[^[:space:]]*/[REDACTED]/Ig' "${response_file}" || true
            {
              echo "## Deployment failed"
              echo
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Environment | ${ENVIRONMENT_NAME} |"
              echo "| Component | ${COMPONENT} |"
              echo "| Commit | \`${GITHUB_SHA}\` |"
              echo "| Coolify webhook | failed, HTTP ${http_code} |"
            } | tee "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          smoke_status="skipped: URL not configured"
          if [[ -n "${SMOKE_BASE_URL:-}" ]]; then
            smoke_status="failed"
            for path in /alive /health; do
                for attempt in {1..10}; do
                smoke_code="$(
                  curl \
                    --silent \
                    --show-error \
                    --connect-timeout 10 \
                    --max-time 10 \
                    --output "/tmp/smoke-${ENVIRONMENT_NAME}-${COMPONENT}.txt" \
                    --write-out '%{http_code}' \
                    "${SMOKE_BASE_URL%/}${path}" || true
                )"

                if [[ "${smoke_code}" == "200" ]]; then
                  smoke_status="passed"
                  break
                fi

                if [[ "${attempt}" == "10" ]]; then
                  echo "Smoke check failed for ${COMPONENT}: ${SMOKE_BASE_URL%/}${path} returned HTTP ${smoke_code}."
                  sed -E 's/(token|authorization|bearer|password|secret)[^[:space:]]*/[REDACTED]/Ig' "/tmp/smoke-${ENVIRONMENT_NAME}-${COMPONENT}.txt" | head -c 4096 || true
                  {
                    echo "## Deployment failed"
                    echo
                    echo "| Field | Value |"
                    echo "|---|---|"
                    echo "| Environment | ${ENVIRONMENT_NAME} |"
                    echo "| Component | ${COMPONENT} |"
                    echo "| Commit | \`${GITHUB_SHA}\` |"
                    echo "| Coolify webhook | accepted, HTTP ${http_code} |"
                    echo "| Smoke check | failed at ${path}, HTTP ${smoke_code} |"
                  } | tee "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
                  exit 1
                fi

                sleep 10
              done
            done
          fi

          {
            echo "## Deployment"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Environment | ${ENVIRONMENT_NAME} |"
            echo "| Component | ${COMPONENT} |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Coolify webhook | accepted, HTTP ${http_code} |"
            echo "| Smoke check | ${smoke_status} |"
            echo "| Workflow run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
            echo
            echo "Rollback: redeploy the previous known-good Coolify deployment or retarget Coolify to the previous immutable image tag/digest per the release runbook."
          } | tee "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Deployment Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-production-evidence
          path: artifacts/deploy/**
          if-no-files-found: warn
          retention-days: 90
