name: Build and Deploy to Coolify

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # 1. ADDED: Trigger workflow on version tags (e.g., v1.0, v2.3.4)
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"

env:
  REGISTRY: atcr.io
  REGISTRY_USER: amirakrari.bsky.social

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image-name: islamu-event-api
            dockerfile: Explore.API/Dockerfile
            context: .
          - image-name: islamu-event-ui
            dockerfile: Explore.Blazor/Dockerfile
            context: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ATcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.ATCR_PASSWORD }}

      # 2. UPDATED: Smart Tagging Logic
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_USER }}/${{ matrix.image-name }}
          # This config generates multiple tags automatically:
          tags: |
            # Always tag as 'latest' (whether it's main branch or a version tag)
            type=raw,value=latest
            # If a git tag (v1.2.3) is pushed, generate 1.2.3
            type=semver,pattern={{version}}
            # If a git tag is pushed, also generate 1.2 (minor version alias)
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push ${{ matrix.image-name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # This automatically uses the list of tags generated above
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_CONFIGURATION=Release

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deployment (API)
        run: |
          echo "Triggering API deployment..."
          curl --fail --request GET \
            '${{ secrets.COOLIFY_DEPLOY_API_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}'

      - name: Trigger Coolify Deployment (UI)
        run: |
          echo "Triggering UI deployment..."
          curl --fail --request GET \
            '${{ secrets.COOLIFY_DEPLOY_UI_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}'