# ABOUTME: Reusable build/test workflow for Release restore, audit, format, build, and project test lanes.
# ABOUTME: Supports intentional no-op execution so required caller checks remain always present.

name: "Build & Test (Reusable)"

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      run-integration-tests:
        required: false
        type: boolean
        default: false
      run-fast-tests:
        required: false
        type: boolean
        default: true
      configuration:
        required: false
        type: string
        default: "Release"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: No-Op for Non-Code Changes
        if: ${{ ! inputs.run-fast-tests }}
        run: |
          {
            echo "## Fast Build/Test"
            echo
            echo "No build/test-relevant changes were detected by the caller workflow."
            echo "This required check is intentionally passing without restore, build, or test execution."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: ${{ inputs.run-fast-tests }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        if: ${{ inputs.run-fast-tests }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        if: ${{ inputs.run-fast-tests }}
        run: dotnet restore --locked-mode

      - name: NuGet Security Audit
        if: ${{ inputs.run-fast-tests }}
        run: |
          dotnet list Explore.sln package --vulnerable --include-transitive --format json --output-version 1 --no-restore > nuget-vulnerabilities.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("nuget-vulnerabilities.json").read_text(encoding="utf-8"))
          findings = []

          def visit(node, project="", framework=""):
              if isinstance(node, dict):
                  current_project = node.get("path", project)
                  current_framework = node.get("framework", framework)
                  vulnerabilities = node.get("vulnerabilities") or []
                  if vulnerabilities:
                      findings.append((current_project, current_framework, node.get("id", "<unknown>"), vulnerabilities))
                  for value in node.values():
                      visit(value, current_project, current_framework)
              elif isinstance(node, list):
                  for item in node:
                      visit(item, project, framework)

          visit(report)

          if findings:
              print("NuGet vulnerabilities detected:")
              for project, framework, package, vulnerabilities in findings:
                  location = " / ".join(part for part in (project, framework) if part)
                  print(f"- {package} ({location or 'unknown project'})")
                  for vulnerability in vulnerabilities:
                      severity = vulnerability.get("severity", "unknown")
                      advisory = vulnerability.get("advisoryUrl") or vulnerability.get("advisoryurl") or "no advisory URL"
                      print(f"  - {severity}: {advisory}")
              raise SystemExit(1)

          print("No NuGet vulnerabilities detected.")
          PY

      - name: Linting Check
        if: ${{ inputs.run-fast-tests }}
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Build
        if: ${{ inputs.run-fast-tests }}
        run: dotnet build --configuration ${{ inputs.configuration }} --no-restore --verbosity minimal

      - name: Unit Tests — Application
        if: ${{ inputs.run-fast-tests }}
        id: test_application
        run: dotnet test --project Event.Application.UnitTests/Event.Application.UnitTests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Application.UnitTests.trx

      - name: Unit Tests — Domain
        if: ${{ inputs.run-fast-tests }}
        id: test_domain
        run: dotnet test --project Event.Domain.UnitTests/Event.Domain.UnitTests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Domain.UnitTests.trx

      - name: Architecture Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_architecture
        run: dotnet test --project Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Architecture.Tests.trx

      - name: Unit Tests — Secrets
        if: ${{ inputs.run-fast-tests }}
        id: test_secrets
        run: dotnet test --project Explore.Secrets.UnitTests/Explore.Secrets.UnitTests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Secrets.UnitTests.trx

      - name: Unit Tests — Infrastructure
        if: ${{ inputs.run-fast-tests }}
        id: test_infrastructure
        run: dotnet test --project Explore.Infrastructure.Tests/Explore.Infrastructure.Tests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Infrastructure.Tests.trx

      - name: Blazor Client Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_blazor_client
        run: dotnet test --project Explore.Blazor.Client.Tests/Explore.Blazor.Client.Tests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Blazor.Client.Tests.trx

      - name: Blazor Integration Tests
        if: ${{ inputs.run-fast-tests }}
        id: test_blazor_integration
        run: dotnet test --project Explore.Blazor.IntegrationTests/Explore.Blazor.IntegrationTests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Explore.Blazor.IntegrationTests.trx

      - name: Upload Test Results
        if: ${{ always() && inputs.run-fast-tests }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-fast
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn
          retention-days: 14

      - name: Write Test Evidence Summary
        if: ${{ always() && inputs.run-fast-tests }}
        env:
          APPLICATION_OUTCOME: ${{ steps.test_application.outcome }}
          DOMAIN_OUTCOME: ${{ steps.test_domain.outcome }}
          ARCHITECTURE_OUTCOME: ${{ steps.test_architecture.outcome }}
          SECRETS_OUTCOME: ${{ steps.test_secrets.outcome }}
          INFRASTRUCTURE_OUTCOME: ${{ steps.test_infrastructure.outcome }}
          BLAZOR_CLIENT_OUTCOME: ${{ steps.test_blazor_client.outcome }}
          BLAZOR_INTEGRATION_OUTCOME: ${{ steps.test_blazor_integration.outcome }}
        run: |
          {
            echo "## Fast Test Evidence"
            echo
            echo "TRX artifact: \`test-results-fast\`"
            echo
            echo "| Project | Step outcome |"
            echo "|---|---|"
            echo "| Event.Application.UnitTests | ${APPLICATION_OUTCOME:-not-run} |"
            echo "| Event.Domain.UnitTests | ${DOMAIN_OUTCOME:-not-run} |"
            echo "| Event.Architecture.Tests | ${ARCHITECTURE_OUTCOME:-not-run} |"
            echo "| Explore.Secrets.UnitTests | ${SECRETS_OUTCOME:-not-run} |"
            echo "| Explore.Infrastructure.Tests | ${INFRASTRUCTURE_OUTCOME:-not-run} |"
            echo "| Explore.Blazor.Client.Tests | ${BLAZOR_CLIENT_OUTCOME:-not-run} |"
            echo "| Explore.Blazor.IntegrationTests | ${BLAZOR_INTEGRATION_OUTCOME:-not-run} |"
            echo
            echo "Inspect the uploaded \`test-results-fast\` artifact for project-specific TRX files."
          } >> "$GITHUB_STEP_SUMMARY"

  integration-tests:
    name: Integration Tests
    if: ${{ inputs.run-fast-tests && inputs.run-integration-tests }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: event_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration ${{ inputs.configuration }} --no-restore --verbosity minimal

      - name: Persistence Integration Tests
        id: test_persistence_integration
        run: dotnet test --project Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.Persistence.IntegrationTests.trx
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=event_test;Username=postgres;Password=password"

      - name: API Integration Tests
        id: test_api_integration
        run: dotnet test --project Event.API.IntegrationTests/Event.API.IntegrationTests.csproj --configuration ${{ inputs.configuration }} --no-build --verbosity minimal -- --report-trx --report-trx-filename Event.API.IntegrationTests.trx
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=event_test;Username=postgres;Password=password"

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-integration
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn
          retention-days: 14

      - name: Write Integration Test Evidence Summary
        if: always()
        env:
          PERSISTENCE_OUTCOME: ${{ steps.test_persistence_integration.outcome }}
          API_OUTCOME: ${{ steps.test_api_integration.outcome }}
        run: |
          {
            echo "## Integration Test Evidence"
            echo
            echo "TRX artifact: \`test-results-integration\`"
            echo
            echo "| Project | Step outcome |"
            echo "|---|---|"
            echo "| Event.Persistence.IntegrationTests | ${PERSISTENCE_OUTCOME:-not-run} |"
            echo "| Event.API.IntegrationTests | ${API_OUTCOME:-not-run} |"
            echo
            echo "Inspect the uploaded \`test-results-integration\` artifact for project-specific TRX files."
          } >> "$GITHUB_STEP_SUMMARY"
