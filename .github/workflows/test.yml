# ABOUTME: CI workflow running build and all test suites on push/PR to main and develop.
# ABOUTME: Skips non-code changes (docs, AI configs, assets). Ensures code compiles and tests pass before merge.

name: "Build & Test"

on:
  push:
    branches: [main, develop]
    paths-ignore:
      # AI / tool configuration directories
      - ".claude/**"
      - ".codex/**"
      - ".copilot/**"
      - ".gemini/**"
      - ".opencode/**"
      - ".repomix/**"
      - ".sisyphus/**"
      - ".taskmaster/**"
      # BMAD framework
      - "_bmad/**"
      - "_bmad-output/**"
      # Documentation & metadata
      - "docs/**"
      - "schemas/**"
      - "assets/**"
      - "dev/**"
      # Project management (Plane)
      - "event/**"
      # Cerbos policies (has own workflow)
      - "cerbos/**"
      # Local dev infrastructure
      - "docker/**"
      - "docker-compose.yml"
      - "Explore.AppHost/**"
      - "Event.Benchmarks/**"
      # Empty / unused directories
      - "amp/**"
      # Markdown & root meta files
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
      - ".mcp.json"
      - "repomix.config.json"
      - "opencode.json"
      - "jean.json"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - ".claude/**"
      - ".codex/**"
      - ".copilot/**"
      - ".gemini/**"
      - ".opencode/**"
      - ".repomix/**"
      - ".sisyphus/**"
      - ".taskmaster/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"
      - "schemas/**"
      - "assets/**"
      - "dev/**"
      - "event/**"
      - "cerbos/**"
      - "docker/**"
      - "docker-compose.yml"
      - "Explore.AppHost/**"
      - "Event.Benchmarks/**"
      - "amp/**"
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
      - ".mcp.json"
      - "repomix.config.json"
      - "opencode.json"
      - "jean.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    uses: ./.github/workflows/_build-test.yml
    with:
      run-integration-tests: false
      configuration: Release
