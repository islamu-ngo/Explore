# ABOUTME: CI workflow running build and all test suites on push/PR to main and develop.
# ABOUTME: Skips non-code changes (docs, AI configs, assets). Ensures code compiles and tests pass before merge.

name: "Build & Test"

on:
  push:
    branches: [main, develop]
    paths-ignore:
      # AI / tool configuration directories
      - ".ai/**"
      - ".caliber/**"
      - ".claude/**"
      - ".codex/**"
      - ".copilot/**"
      - ".gemini/**"
      - ".opencode/**"
      - ".repomix/**"
      - ".sisyphus/**"
      - ".taskmaster/**"
      # BMAD framework
      - "_bmad/**"
      - "_bmad-output/**"
      # Documentation & metadata
      - "docs/**"
      - "schemas/**"
      - "assets/**"
      - "dev/**"
      # Project management (Plane)
      - "event/**"
      # Cerbos policies (has own workflow)
      - "cerbos/**"
      # Local dev infrastructure
      - "docker/**"
      - "docker-compose.yml"
      - "Explore.AppHost/**"
      - "Event.Benchmarks/**"
      # Empty / unused directories
      - "amp/**"
      # Markdown & root meta files
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
      - ".mcp.json"
      - "repomix.config.json"
      - "opencode.json"
      - "jean.json"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - ".ai/**"
      - ".caliber/**"
      - ".claude/**"
      - ".codex/**"
      - ".copilot/**"
      - ".gemini/**"
      - ".opencode/**"
      - ".repomix/**"
      - ".sisyphus/**"
      - ".taskmaster/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"
      - "schemas/**"
      - "assets/**"
      - "dev/**"
      - "event/**"
      - "cerbos/**"
      - "docker/**"
      - "docker-compose.yml"
      - "Explore.AppHost/**"
      - "Event.Benchmarks/**"
      - "amp/**"
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
      - ".mcp.json"
      - "repomix.config.json"
      - "opencode.json"
      - "jean.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore --verbosity minimal

      # Run each test project individually per CLAUDE.md convention
      - name: Unit Tests — Application
        run: dotnet test --project Event.Application.UnitTests/Event.Application.UnitTests.csproj --configuration Release --no-build --verbosity minimal

      - name: Unit Tests — Domain
        run: dotnet test --project Event.Domain.UnitTests/Event.Domain.UnitTests.csproj --configuration Release --no-build --verbosity minimal

      - name: Architecture Tests
        run: dotnet test --project Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Unit Tests — Secrets
        run: dotnet test --project Explore.Secrets.UnitTests/Explore.Secrets.UnitTests.csproj --configuration Release --no-build --verbosity minimal

      - name: Blazor Client Tests
        run: dotnet test --project Explore.Blazor.Client.Tests/Explore.Blazor.Client.Tests.csproj --configuration Release --no-build --verbosity minimal

      - name: Blazor Integration Tests
        run: dotnet test --project Explore.Blazor.IntegrationTests/Explore.Blazor.IntegrationTests.csproj --configuration Release --no-build --verbosity minimal

      # Integration tests excluded from CI — they require PostgreSQL + Keycloak infrastructure
      # - name: Persistence Integration Tests
      #   run: dotnet test --project Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj
      # - name: API Integration Tests
      #   run: dotnet test --project Event.API.IntegrationTests/Event.API.IntegrationTests.csproj
