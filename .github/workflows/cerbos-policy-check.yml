# ABOUTME: Validates Cerbos authorization policies on changes to policy files or authorization code.
# ABOUTME: Compiles policies and runs policy tests to catch misconfigurations before merge.

name: Cerbos Policy Validation

on:
  push:
    branches: [main, develop]
    paths:
      - "cerbos/**"
      - "Explore.Application/Authorization/**"
      - ".github/workflows/cerbos-policy-check.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "cerbos/**"
      - "Explore.Application/Authorization/**"
      - ".github/workflows/cerbos-policy-check.yml"

jobs:
  cerbos-policy-check:
    name: Cerbos Policy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Cerbos
        uses: cerbos/cerbos-setup-action@v1
        with:
          version: "latest"

      - name: Compile Cerbos Policies
        run: |
          cerbos compile cerbos/policies

      - name: Run Cerbos Policy Tests
        if: hashFiles('cerbos/tests/**') != ''
        run: |
          cerbos compile --tests=cerbos/tests cerbos/policies
