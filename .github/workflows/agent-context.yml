# ABOUTME: Validates the AI-context contract on PRs that touch agent, skill, rule, contract, or doc files.
# ABOUTME: Runs AgentContext*Tests from Event.Architecture.Tests to block drift, dead links, schema violations, and duplication.

name: agent-context

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".claude/**"
      - "docs/**"
      - "dev/_journal/README.md"
      - "dev/_journal/FINDING_TEMPLATE.md"
      - "dev/_journal/PROMOTION_RULES.md"
      - "Event.Architecture.Tests/AgentContext*.cs"
      - "Event.Architecture.Tests/ContextSystemHelpers.cs"
  push:
    branches:
      - main
      - develop
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
      - ".claude/**"
      - "docs/**"
      - "dev/_journal/README.md"
      - "dev/_journal/FINDING_TEMPLATE.md"
      - "dev/_journal/PROMOTION_RULES.md"

jobs:
  agent-context:
    name: Validate AI-Context Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore Event.Architecture.Tests/Event.Architecture.Tests.csproj

      - name: Build
        run: dotnet build Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --no-restore --verbosity quiet

      # TUnit runs as an executable; we run only this project.
      # Non-context tests in this project are expected to pass as well; if any unrelated failure blocks the PR,
      # fix those in a dedicated change rather than relaxing this gate.
      - name: Run Event.Architecture.Tests
        run: dotnet test --project Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --no-build --verbosity quiet
