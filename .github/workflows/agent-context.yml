# ABOUTME: Validates the AI-context contract on PRs that touch agent, skill, rule, contract, or doc files.
# ABOUTME: Always reports a status check, running architecture context tests only when context-owned files change.

name: agent-context

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  agent-context:
    name: Validate AI-Context Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect Agent-Context Changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## AI-Context Contract"
              echo
              echo "Manual run: executing architecture context tests."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          if [[ -z "$changed_files" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## AI-Context Contract"
              echo
              echo "Could not determine changed files; running architecture context tests fail-safe."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant_files=""
          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue
            case "$changed_file" in
              AGENTS.md|.github/copilot-instructions.md|.claude/*|docs/*|dev/_journal/README.md|dev/_journal/FINDING_TEMPLATE.md|dev/_journal/PROMOTION_RULES.md|Event.Architecture.Tests/AgentContext*.cs|Event.Architecture.Tests/ContextSystemHelpers.cs|.github/workflows/agent-context.yml)
                relevant_files="${relevant_files}${changed_file}"$'\n'
                ;;
            esac
          done <<< "$changed_files"

          if [[ -n "$relevant_files" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            {
              echo "## AI-Context Contract"
              echo
              echo "Agent/context files changed; running architecture context tests."
              echo
              echo '```text'
              printf '%s' "$relevant_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            {
              echo "## AI-Context Contract"
              echo
              echo "No agent/context-owned files changed; required check is intentionally passing without running architecture context tests."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: No-Op for Non-Agent-Context Changes
        if: ${{ steps.changes.outputs.run-tests != 'true' }}
        run: |
          echo "AI-context contract no-op: no agent/context-owned changes detected."

      - name: Setup .NET
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        run: dotnet restore Event.Architecture.Tests/Event.Architecture.Tests.csproj --locked-mode

      - name: Build
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        run: dotnet build Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --no-restore --verbosity quiet

      # TUnit runs as an executable; we run only this project.
      # Non-context tests in this project are expected to pass as well; if any unrelated failure blocks the PR,
      # fix those in a dedicated change rather than relaxing this gate.
      - name: Run Event.Architecture.Tests
        if: ${{ steps.changes.outputs.run-tests == 'true' }}
        run: dotnet test --project Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --no-build --verbosity quiet
