# ABOUTME: CodeQL security scanning for C#, JS/TS, and GitHub Actions.
# ABOUTME: Runs on pushes to main, PRs to main, and weekly schedule.

name: "CodeQL Advanced"

on:
  push:
    branches: [main]
    paths-ignore:
      - ".ai/**"
      - ".caliber/**"
      - ".claude/**"
      - ".codex/**"
      - ".copilot/**"
      - ".gemini/**"
      - ".opencode/**"
      - ".repomix/**"
      - ".sisyphus/**"
      - ".taskmaster/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"
      - "schemas/**"
      - "assets/**"
      - "dev/**"
      - "event/**"
      - "docker/**"
      - "docker-compose.yml"
      - "amp/**"
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
      - ".mcp.json"
      - "repomix.config.json"
      - "opencode.json"
      - "jean.json"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".ai/**"
      - ".caliber/**"
      - ".claude/**"
      - ".codex/**"
      - ".copilot/**"
      - ".gemini/**"
      - ".opencode/**"
      - ".repomix/**"
      - ".sisyphus/**"
      - ".taskmaster/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "docs/**"
      - "schemas/**"
      - "assets/**"
      - "dev/**"
      - "event/**"
      - "docker/**"
      - "docker-compose.yml"
      - "amp/**"
      - "**.md"
      - "LICENSE"
      - ".editorconfig"
      - ".dockerignore"
      - ".mcp.json"
      - "repomix.config.json"
      - "opencode.json"
      - "jean.json"
  schedule:
    - cron: "27 2 * * 0"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'Manual build mode is not configured.'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
