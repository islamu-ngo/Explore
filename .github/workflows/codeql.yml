# ABOUTME: CodeQL security scanning for C#, JS/TS, and GitHub Actions.
# ABOUTME: Always reports checks, running analysis only when CodeQL-relevant files change.

name: "CodeQL Advanced"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "27 2 * * 0"
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  detect-codeql-changes:
    name: Detect CodeQL-Relevant Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run-analysis: ${{ steps.changes.outputs.run-analysis }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect CodeQL-Relevant Changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          is_codeql_ignored() {
            case "$1" in
              .claude/*|.codex/*|.copilot/*|.gemini/*|.opencode/*|.repomix/*|.sisyphus/*|.taskmaster/*|_bmad/*|_bmad-output/*|docs/*|schemas/*|assets/*|dev/*|event/*|docker/*|docker-compose.yml|amp/*|*.md|LICENSE|.editorconfig|.dockerignore|.mcp.json|repomix.config.json|opencode.json|jean.json)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run-analysis=true" >> "$GITHUB_OUTPUT"
            {
              echo "## CodeQL Advanced"
              echo
              echo "Scheduled/manual run: executing CodeQL analysis."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          base_sha=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base_sha="$MERGE_GROUP_BASE_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi

          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD~1"
          fi

          changed_files="$(git diff --name-only "$base_sha" "$GITHUB_SHA" || true)"
          if [[ -z "$changed_files" ]]; then
            echo "run-analysis=true" >> "$GITHUB_OUTPUT"
            {
              echo "## CodeQL Advanced"
              echo
              echo "Could not determine changed files; running CodeQL analysis fail-safe."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          relevant_files=""
          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue
            if ! is_codeql_ignored "$changed_file"; then
              relevant_files="${relevant_files}${changed_file}"$'\n'
            fi
          done <<< "$changed_files"

          if [[ -n "$relevant_files" ]]; then
            echo "run-analysis=true" >> "$GITHUB_OUTPUT"
            {
              echo "## CodeQL Advanced"
              echo
              echo "CodeQL-relevant files changed; running analysis."
              echo
              echo '```text'
              printf '%s' "$relevant_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run-analysis=false" >> "$GITHUB_OUTPUT"
            {
              echo "## CodeQL Advanced"
              echo
              echo "Only CodeQL-ignored files changed; required analysis checks are intentionally passing without CodeQL initialization."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect-codeql-changes
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: No-Op for CodeQL-Ignored Changes
        if: ${{ needs.detect-codeql-changes.outputs.run-analysis != 'true' }}
        run: |
          echo "CodeQL no-op: only CodeQL-ignored files changed."

      - name: Checkout repository
        if: ${{ needs.detect-codeql-changes.outputs.run-analysis == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        if: ${{ needs.detect-codeql-changes.outputs.run-analysis == 'true' && matrix.language == 'csharp' }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Initialize CodeQL
        if: ${{ needs.detect-codeql-changes.outputs.run-analysis == 'true' }}
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Run manual build steps
        if: ${{ needs.detect-codeql-changes.outputs.run-analysis == 'true' && matrix.build-mode == 'manual' }}
        shell: bash
        run: |
          dotnet restore --locked-mode
          dotnet tool restore
          dotnet build --configuration Release --no-restore --verbosity minimal

      - name: Perform CodeQL Analysis
        if: ${{ needs.detect-codeql-changes.outputs.run-analysis == 'true' }}
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:${{matrix.language}}"
