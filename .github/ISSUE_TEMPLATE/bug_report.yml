name: Bug report
description: Report a reproducible defect, validation gap, or regression.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for a contributor or AI agent to reproduce and validate the issue without guessing.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Describe the defect in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List exact steps, commands, requests, or UI actions.
      placeholder: |
        1. Go to ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error text, status codes, or screenshots where useful.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Affected version or branch
      placeholder: main, develop, commit SHA, tag, or deployment version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, traces, or failing validation
      description: Paste non-secret evidence only. Redact tokens, tenant data, PII, and connection strings.
  - type: textarea
    id: scope
    attributes:
      label: Affected docs or code paths
      description: List files, routes, endpoints, commands, or docs if known.
      placeholder: docs/SELF_HOSTING.md, Explore.API/Controllers/..., dotnet test --project ...
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, tokens, PII, and private tenant data from this report.
          required: true
