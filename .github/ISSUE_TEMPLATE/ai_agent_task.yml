# ABOUTME: AI agent task template for packaging scoped tasks with context and validation rules.
# ABOUTME: Collects files in scope, required docs/skills, validation commands, and handoff expectations.

name: 🤖 AI Agent Task
description: Package a task so an AI agent can start with enough context and validation expectations.
title: "[Task]: "
labels: ["ai-agent"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when delegating a repo task to an AI coding agent. Include durable context, likely file paths, required docs/rules, and concrete validation.
  - type: textarea
    id: task-context
    attributes:
      label: Task context
      description: What needs to change, why, and what outcome is expected?
    validations:
      required: true
  - type: textarea
    id: files-in-scope
    attributes:
      label: Files likely in scope
      description: List source anchors, docs, tests, workflows, or directories the agent should inspect first.
      placeholder: docs/..., Explore.API/..., Event.Architecture.Tests/...
    validations:
      required: true
  - type: textarea
    id: required-docs-rules
    attributes:
      label: Required docs and rules
      description: List project docs, skills, plans, or active context files the agent must follow.
      placeholder: AGENTS.md, docs/CONTRIBUTING.md, dev/active/.../context.md
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation expectations
      description: Include exact project-level build/test/docs commands or manual checks. Do not use solution-level dotnet test.
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff expectations
      description: What should the agent update before stopping? Include dev docs, docs impact, risks, and next actions.
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Guardrails
      options:
        - label: The task includes enough context to start without guessing.
          required: true
        - label: The validation expectations use per-project commands, not solution-level `dotnet test`.
          required: true
