# ABOUTME: Registers public release-note scopes separately from valid engineering-only scopes.
# ABOUTME: Lets release policy reject unknown scopes without using code-layer or forge labels.
schemaVersion: 1
publicScopes:
  - events
  - registration
  - ticketing
  - discovery
  - notifications
  - privacy
  - access
  - storage
  - onboarding
  - federation
  - webhooks
  - localization
  - accessibility
  - self-hosting
engineeringScopes:
  - ci
  - dependencies
  - architecture
  - database
  - observability
  - documentation
  - release
  - testing
  - build
