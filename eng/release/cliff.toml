# ABOUTME: Defines presentation-only Markdown rendering for normalized release context.
# ABOUTME: Contains no commit policy, versioning, provider, URL, or command processors.

[changelog]
body = """
# Release {{ version }}
{% for commit in commits %}
- {{ commit.group }}: {{ commit.message }} ({{ commit.id }})
{% endfor %}
"""
trim = true
render_always = true
