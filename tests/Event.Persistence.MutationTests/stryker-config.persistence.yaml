# ABOUTME: Bounds mutation testing to portable persistence decisions owned by this workstream.
# ABOUTME: Excludes migrations, generated artifacts, provider SQL text, and unrelated repositories.

stryker-config:
  solution: ../../Explore.slnx
  project: Explore.Persistence.csproj
  test-projects:
    - Event.Persistence.MutationTests.csproj
  configuration: Release
  test-runner: mtp
  coverage-analysis: perTest
  concurrency: 4
  thresholds:
    high: 86
    low: 86
    break: 86
  reporters:
    - progress
    - json
    - html
  mutate:
    - "**/RegistrationUniqueConflictMessageParser.cs"
    - "**/RelationalModelNamespace.cs"
    - "**/MySqlModelIdentifierPolicy.cs"
