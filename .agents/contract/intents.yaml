  - id: ip-clean-room-governance
    title: "Establish or apply IP clean-room and outbound-license governance"
    category: cross-cutting
    triggers:
      - "IP protection"
      - "clean-room governance"
      - "external functional research"
      - "SSO differentiation"
      - "dependency license compatibility"
      - "audit readiness"
    must_read_docs:
      - AGENTS.md
      - docs/QUICK_REFERENCE.md
      - docs/legal/IP_GOVERNANCE.md
      - docs/legal/CONTRIBUTION_GOVERNANCE.md
      - docs/DUAL_VERSIONING.md
      - docs/CI_CD_GOVERNANCE.md
      - .agents/skills/_SKILL_SCHEMA.md
    load_skills:
      - ip-clean-room
      - skill-authoring
      - agentic-research
    load_rules:
      - .claude/rules/ip-clean-room.md
    paths_in_scope:
      - "AGENTS.md"
      - "docs/QUICK_REFERENCE.md"
      - "docs/index.md"
      - "docs/legal/IP_GOVERNANCE.md"
      - ".agents/skills/ip-clean-room/**"
      - ".claude/rules/ip-clean-room.md"
      - ".claude/rules/README.md"
      - ".claude/contract/intents.yaml"
      - ".claude/commands/review-pr.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "dev/_journal/journal.md"
      - "tests/Event.Architecture.Tests/AgentContextGovernanceTests.cs"
    minimum_tests:
      - Event.Architecture.Tests
    docs_to_update:
      - docs/QUICK_REFERENCE.md
      - docs/legal/IP_GOVERNANCE.md
      - docs/index.md
      - .claude/contract/intents.yaml
    unique_acceptance:
      - "Implementation contexts receive source-free functional handoffs and never third-party source or source-derived representations"
      - "AFC/SSO review distinguishes constrained functional elements from independently designed expression without claiming legal certification"
      - "Dependency review protects every intended ISLAMU outbound licensing path and never treats the CLA as authority over third-party material"
      - "The clean-room skill and rule satisfy repository schemas without skip exceptions and link to reproducible audit templates"
      - "PR review requires a provenance disposition and the journal contains a source-free dry-run record"
    pr_checklist:
      - "No third-party source, snippet, AST, decompiled artifact, SQL, migration, test, comment, prose, asset, or source-derived structure entered implementation context or the diff"
      - "Externally informed work links a sanitized functional handoff, source register, fresh-context attestation, and independent AFC/SSO decision; otherwise the PR states Not externally informed"
      - "Every dependency change passes the repository scanner and preserves every intended outbound model or links documented separate-license and distribution approval"
      - "No report removes source identity to create false non-attribution, and no audit artifact retains restricted expression"
      - "Agent-context schema, link, intent-manifest, diff, build, and architecture evidence is recorded with unrelated failures named separately"
    forbidden_without_approval:
      - "Ingesting third-party implementation source or source-derived representations into an implementation context"
      - "Copying or translating third-party code, SQL, migrations, tests, comments, prose, assets, or expressive SSO"
      - "Adding a dependency that blocks an intended ISLAMU outbound licensing path"
      - "Treating a CLA signature, scanner result, optional loading, dynamic linking, or process isolation as automatic third-party license approval"
      - "Continuing implementation after source contamination without discarding unmerged output and restarting from a sanitized handoff"
    related_agents:
      - architect-agent
      - librarian-agent
      - quality-verifier-agent

