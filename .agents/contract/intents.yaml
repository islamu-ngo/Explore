  - id: schedule-background-work
    title: "Add or change recurring background work (Quartz job or hosted service)"
    category: infrastructure
    triggers:
      - "add a scheduled job"
      - "add a background job"
      - "background job"
      - "add a background service"
      - "cron job"
      - "scheduler change"
      - "recurring cleanup"
      - "periodic sweep"
      - "change a cron schedule"
      - "retention cleanup job"
      - "schedule a deadline"
      - "wake work at a future time"
    must_read_docs:
      - docs/OPERATIONS.md
      - docs/ARCHITECTURE.md
      - docs/QUICK_REFERENCE.md
      - docs/CONFIGURATION.md
      - docs/TESTING.md
      - docs/OUTBOX_PATTERN.md
    load_skills:
      - outbox-pattern
      - clean-architecture-rules
    load_rules:
      - .agents/rules/api-scheduling.md
      - .agents/rules/application-layer.md
      - .agents/rules/efcore-persistence.md
      - .agents/rules/tests.md
    paths_in_scope:
      - "src/Explore.API/Scheduling/**/*.cs"
      - "src/Explore.API/BackgroundServices/**/*.cs"
      - "src/Explore.API/Extensions/QuartzSchedulerExtensions.cs"
      - "src/Explore.API/Configuration/QuartzSchedulerSettings*.cs"
      - "src/Explore.Application/Contracts/Scheduling/**/*.cs"
      - "src/Explore.API/Resources/Quartz/**"
      - "src/Explore.API/appsettings*.json"
      - "docs/OPERATIONS.md"
      - "docs/CONFIGURATION.md"
    minimum_tests:
      - Event.Persistence.IntegrationTests
      - Event.API.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - docs/OPERATIONS.md
      - docs/CONFIGURATION.md
    unique_acceptance:
      - "Quartz is the only scheduler; no bespoke timer loop or second scheduling package is introduced"
      - "The job body is a single pass — enablement, interval, cancellation, exception containment, and DI scope belong to the scheduler"
      - "Registration goes through AddSweepJob/AddCronJob, and a disabled sweep is not registered at all"
      - "The job identifier lives in ScheduledJobNames and is treated as an operational contract, since renaming one orphans its persisted trigger"
      - "JobDataMap payloads carry durable identifiers only; content stays in the application database"
      - "Quartz types stay inside Explore.API; Application code depends on IScheduledJobRegistry"
      - "Job identifiers, log event names, health-check names, metric names, and configuration keys are operator-visible and documented in the same slice"
      - "Cron expressions use Quartz's 6-or-7-field syntax with '?' in exactly one of day-of-month or day-of-week; a Unix 5-field expression is silently wrong here"
      - "New scheduler columns are added to every provider script at once, because Quartz treats an absent optional column as a warning and keeps running with that behaviour disabled"
      - "A deadline registered through IScheduledDeadlineDispatcher is paired with a reconciliation sweep that owns correctness, and its registration failure never fails the caller's transaction"
      - "Listener code (IJobListener/ITriggerListener) is exception-contained in every method, because an unhandled listener exception can disrupt the scheduling cycle"
    forbidden_without_approval:
      - "Introducing a second scheduling mechanism, or reintroducing TickerQ"
      - "Referencing Quartz types outside Explore.API, including from Explore.Application or Explore.Domain"
      - "Placing payloads, PII, message content, secrets, or provider identifiers in a JobDataMap or ScheduledDeadline pointer"
      - "Creating an EF Core migration for scheduler tables; the QRTZ_ schema is raw ADO shipped as embedded per-provider DDL"
      - "Adding DROP, TRUNCATE, or any other destructive statement to a scheduler DDL script, which runs on every startup"
      - "Moving retry, fencing, lease, or outbox semantics up into the scheduling layer"
      - "Converting OutboxProcessor or a retry-until-success bootstrap worker into a recurring trigger"
      - "Renaming an existing scheduled job identifier or its completion log event"
    related_agents:
      - architect-agent
      - backend-engineer-agent
      - platform-operations-agent
      - quality-verifier-agent
      - change-reviewer-agent

