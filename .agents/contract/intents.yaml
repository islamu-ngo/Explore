      - "dotnet build --configuration Release --verbosity quiet"
      - 'dotnet test --project tests/Event.Persistence.IntegrationTests/Event.Persistence.IntegrationTests.csproj --configuration Release -- --treenode-filter "/*/*/PrimaryDatabaseProviderCompositionTests/*" --minimum-expected-tests 1 --no-progress --maximum-parallel-tests 1'
      - 'dotnet test --project tests/Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release -- --treenode-filter "/*/*/ProviderMigrationOwnershipTests/*" --minimum-expected-tests 1 --no-progress --maximum-parallel-tests 1'
