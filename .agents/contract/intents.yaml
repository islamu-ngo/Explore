    unique_acceptance:
      - "PostgreSQL exact bytes, SHA-256, and provenance are the sole payload, signing, idempotency, and transmission authority; parsed JSON is never authoritative"
      - "Inbound acceptance, effect receipt or durable external outbox, attempt evidence, and settlement preserve one transaction boundary with verified tenant ownership"
      - "Webhook lookup contracts expose stable normalized Id, Code, and Name values with enum, seeder, migration, and database parity"
      - "Provider publication uncertainty fails closed and never retries a create unless conformance-proven lookup can reconcile the ambiguous result"
      - "Every background item creates a fresh scope and executes under its persisted tenant; tenant or capability data supplied by callers is never authoritative"
      - "Operational actions are authorized server-side, represented by HAL links, and rendered by Blazor only when the matching link exists"
      - "Removed compatibility members, aliases, dual writes, legacy request authority, and new messaging infrastructure are absent"
    pr_checklist:
      - "Verified zero third-party source or source-derived ingestion, a sanitized handoff and independent AFC/SSO review for external influence, and outbound-license compatibility for dependency changes"
      - "Failing-first evidence covers exact-byte mutation, duplicate processing, tenant substitution, ambiguous provider acceptance, and HAL omission before implementation"
      - "Repositories still return entities, handlers map DTOs, validators are manually instantiated, and normalized lookup parity is verified"
      - "Migrations are additive, deterministic, and reversible; legacy rows are classified without guessed success and the EF model has no pending changes"
      - "Logs, traces, metrics, DTOs, and support artifacts exclude payloads, secrets, tokens, full destination URLs, raw provider responses, and tenant metric labels"
      - "OpenAPI schemas and the generated NSwag client converge on a second generation and contain no removed compatibility fields"
      - "All minimum test projects execute nonzero tests and the Local, optional Svix, API, BFF, HAL, browser, retention, and recovery surfaces have evidence"
      - "Webhook, API, Blazor, operations, configuration, self-hosting, backup/restore, troubleshooting, schema, and active development docs match the shipped behavior"
    forbidden_without_approval:
      - "Restoring backward-compatibility properties, DTO aliases, deprecated methods, dual writes, or legacy request authority"
      - "Adding Redis, RabbitMQ, Kafka, CDC, another reverse proxy, a generic provider plugin system, or any other new webhook infrastructure"
      - "Treating caller-supplied tenant, binding, provider capability, or portal authority as trusted state"
      - "Persisting or logging response bodies, payloads, secrets, tokens, full destination URLs, raw provider responses, or provider exception text"
      - "Performing a network call inside a database transaction or migration"
      - "Automatically retrying provider creation after ambiguous acceptance without conformance-proven reconciliation"
      - "Editing an applied migration, bypassing tenant filters, hand-editing generated contracts, or gating UI actions by roles or claims"
