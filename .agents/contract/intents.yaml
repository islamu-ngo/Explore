    unique_acceptance:
      - "Runtime, Domain, Application, Persistence, API, MigrationService, and AppHost authority surfaces use generalized PrivacyErasure* names; legacy LocationPrivacy* authority names remain only in migration-history evidence"
      - "Exactly one authority-first workflow appends or reuses an immutable fact before application mutation; only the IPrivacyErasureAuthority storage adapter varies by topology"
      - "PrivacyErasure:Authority:Topology accepts only EmbeddedSqlite, CoLocated, or ExternalDatabase; the default is EmbeddedSqlite, topology is never inferred from a connection string, EmbeddedSqlite never opens an external connection, CoLocated uses the primary PostgreSQL/SQLite database, and ExternalDatabase uses external PostgreSQL"
      - "A present legacy PrivacyErasure:Durability:Mode key is rejected with actionable replacement-key and pre-v1 reset-only guidance; no compatibility shim or silent translation is allowed"
      - "The application-side replay checkpoint remains active in all topologies and is atomically confirmed with local dispositions, provider work, cache authority, and receipt state"
      - "User is the only executable subject kind; facts and work are typed and versioned, with no table, column, free-form JSON, or reflection-driven instruction surface"
      - "The authority fact and User fence exist before PII enumeration; one serializable application transaction records local erasure state, policy coverage, specialized provider work, cache invalidation, and a fixed-time-verifiable hash of the once-revealed short-lived receipt"
      - "All current durable User-PII copies have one machine-checked disposition, exact subject and tenant predicates, and canary proof that unrelated users and tenants remain unchanged"
      - "Provider cleanup runs only after commit through specialized idempotent fenced outboxes with bounded retry, dead-letter or unknown settlement, and ownership checks"
      - "Startup replay runs before API traffic and ordinary workers in all topologies; ExternalDatabase restore replay is protective only when its authority database has an independent restore lifecycle"
      - "SQLite authority migrations solely own the ie_-prefixed authority tables in the selected embedded or co-located SQLite file, co-located PostgreSQL authority migrations solely own retained authority tables in the configured primary schema, application migrations solely own the replay checkpoint, and dedicated external authority migrations solely own external PostgreSQL tables, functions, roles, and grants"
      - "For ExternalDatabase, API runtime and MigrationService receive separate runtime and migrator authority credentials mapped to structured privacy-prefixed database fields only in the owning process; EmbeddedSqlite and CoLocated receive no authority database credential and Blazor receives neither secret"
      - "Authority identifiers are treated as linkable personal data, retained only through the maximum resurrection-capable backup horizon plus the approved safety margin, and protected by function-only least privilege, legal-hold pseudonymization, expiry cleanup, and redacted observability"
      - "This workstream owns receipt/status, provider settlement, startup replay, retention, and restore behavior; Event Location contributes only its typed disposition and correction adapter"
      - "Every minimum test project executes a nonzero test count; the Release build, MigrationService/AppHost builds, all pending-model checks, fresh migration apply, real-file EmbeddedSqlite, two-database external PostgreSQL, HTTP/SQL/provider, and old-backup restore rehearsals are evidenced"
    pr_checklist:
      - "Verified zero third-party source or source-derived ingestion, a sanitized handoff and independent AFC/SSO review for external influence, and outbound-license compatibility for dependency changes"
      - "PIN, RED, and GREEN evidence covers completeness, malformed facts/receipts/config/catalogs, cross-tenant isolation, concurrent retries, provider ambiguity, stale restore, cancellation/resume, and PII canaries"
      - "Clean Architecture remains inward-only; repositories return entities, handlers map DTOs, validators are manually instantiated, and only one dedicated Persistence adapter may cross tenant filters with a named reason and exact predicates"
      - "PrivacyErasure* naming, PrivacyErasure:Authority:Topology, EmbeddedSqlite/CoLocated/PostgreSQL and external PostgreSQL semantics, structured privacy-prefixed database fields, OpenAPI, schemas, Compose, AppHost, MigrationService, active planning, and operator docs agree"
      - "Application and dedicated authority migrations have non-overlapping topology ownership, carry every classified current PostgreSQL invariant, follow the approved reset-only policy, and leave no pending model changes"
      - "No provider call occurs in a handler, database transaction, migration, or startup replay transaction; specialized outboxes prove idempotency, fencing, retries, unknown outcomes, and ownership limits"
      - "Logs, metrics, traces, health, ProblemDetails, receipts, ledgers, evidence, and support artifacts contain no PII, identifiers, credentials, provider payloads/responses, URLs, or free-text errors"
      - "EmbeddedSqlite proves old-application-backup replay from its untouched authority file; CoLocated reports restoreReplayProtection=false and is backed up and restored atomically with the primary database; ExternalDatabase proves old-application-backup replay from untouched independently restored external PostgreSQL, bounded retention, legal-hold pseudonymization, and unrelated-user preservation"
      - "Opening and closing hashes attribute dirty work; no unrelated file, test, database, container, volume, backup, process, port, or temporary artifact is changed or left behind"
    forbidden_without_approval:
      - "Adding arbitrary JSON, table, column, SQL, reflection-driven, prompt-derived, or other executable erasure instructions"
      - "Storing live PII in the authority database, joining it from normal request paths, or introducing a distributed transaction"
      - "Bypassing tenant filters outside the one dedicated Persistence erasure adapter with a named reason and exact subject and tenant predicates"
      - "Calling Keycloak, ATProto, Listmonk, SMTP, object storage, webhooks, or any provider inside a handler, database transaction, migration, or startup replay transaction"
      - "Emitting PII, linkable identifiers, secrets, receipt credentials, provider payloads/responses, URLs, exception text, or unbounded values to logs, metrics, traces, health, ProblemDetails, evidence, or support artifacts"
      - "Deleting an upstream identity or account the platform does not own, or claiming recipient-controlled, downloaded, federated, delivered, or third-party copies can always be recalled"
      - "Adding executable Organization or Tenant erasure before its typed policy, handler, inventory, authorization, and verification ship atomically"
      - "Restoring old migration IDs, hand-writing generated designer or snapshot files, or deleting, rewriting, or regenerating migration history outside the exact user-performed 2026-07-20 exception recorded below"
      - "Deleting any database, container, volume, backup, unrelated file, or unrelated dirty-worktree change; agents have no such authority under the migration-history exception"
      - "Adding a message broker, generic provider plugin, generic erasure interpreter, or new dependency for behavior the current platform already provides"
      - "Weakening or deleting failing tests, tenant isolation, least-privilege ACLs, append-only guards, irreversible guards, legal holds, retention checks, receipt authorization, or HAL affordance rules"
