    unique_acceptance:
      - "ISLAMU remains authoritative for workflow, normalized answers, capacity, approval, and confirmation; external completion is evidence only"
      - "Every attempt pins the exact form, provider binding, mapping, participation, workflow, and ticket catalog versions it uses"
      - "Canonical answers are typed atomic rows with database-enforced value and subject shape; JSON and provider payloads are not answer truth"
      - "Guest writes use PublicTransactional controls: dedicated rate limit, antiforgery decision, idempotency, hashed scoped capability, and PII-free telemetry"
      - "All participant and organizer UI affordances and Studio sections are authorized by server-authored HAL links, never local roles or capability booleans"
      - "Provider calls execute outside business transactions; durable inbox, outbox, fencing, retry, and reconciliation coordinate every external effect"
      - "Published forms and ticket catalogs are immutable; future edits create versions while active attempts and orders remain pinned"
      - "Money uses integer minor units at persistence and API boundaries with no foreign-exchange conversion; platform monetization is instance-admin-only and defaults off or zero"
    pr_checklist:
      - "Verified zero third-party source or source-derived ingestion, a sanitized handoff and independent AFC/SSO review for external influence, and outbound-license compatibility for dependency changes"
      - "Failing-first tests cover state transitions, malformed inputs, tenant isolation, guest capabilities, duplicate callbacks, duplicate finalization, and shared-capacity races"
      - "Repositories return entities, handlers map DTOs, validators are manually instantiated, and all new lookups have enum, seeder, migration, and API metadata parity"
      - "Every new tenant entity has central tenant and named soft-delete filters, auditing, concurrency, and cross-tenant negative tests"
      - "No provider HTTP, email, webhook, broker, or storage call occurs inside a business transaction; required effects are durable and post-commit"
      - "Cerbos policies, HAL policies, endpoint classifications, OpenAPI, and the generated client converge without client-side authorization inference"
      - "Logs, metrics, traces, ProblemDetails, health, support artifacts, and ordinary webhooks contain no answers, PII, guest tokens, secrets, or raw provider payloads"
      - "All minimum test projects execute nonzero tests and phase-specific real PostgreSQL concurrency tests prove hold/finalization correctness"
      - "Product, security, authorization, provider, self-hosting, schema, and active development docs match the shipped behavior"
    forbidden_without_approval:
      - "Adding backward-compatibility aliases, dual writes, deprecated registration contracts, or data-migration shims"
      - "Reusing Event custom-property rows for registration answers or storing canonical answers only as JSON"
      - "Treating provider completion, redirect return, iframe navigation, or an external click as registration confirmation"
      - "Using provider names as capability authority, silently switching active attempts, or silently accepting external schema drift"
      - "Performing provider I/O inside a database transaction or letting callback controllers mutate registration aggregates"
      - "Using public/display identifiers as guest authorization, storing plaintext capabilities, or logging tokens, PII, answers, or provider payloads"
      - "Granting reported-listing contributors organizer, provider, commercial, or attendee-data authority"
      - "Gating Blazor actions or Studio navigation with local role, claim, status, provenance, or capability-boolean checks"
      - "Enabling platform fees or contributions at tenant scope, defaulting monetization on, using floating-point money, or mixing contributions with organizer earnings"
      - "Building payment-provider, refund, tax, payout, or admission-credential integrations before their future ADRs are approved"
      - "Copying code, SQL, migrations, snippets, or assets from Hi.Events; only the approved clean-room behavior report may be used"
      - "Deleting or rewriting migration history, hand-editing generated EF designer/snapshot files, or bypassing the migration-baseline ordering decision"
    related_agents:
      - architect-agent
      - backend-engineer-agent
      - presentation-engineer-agent
      - quality-verifier-agent
    related_intents:
      - add-get-endpoint
      - add-write-endpoint
