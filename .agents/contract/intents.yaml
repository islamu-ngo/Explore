      - docs/DUAL_VERSIONING.md
    load_skills:
      - ip-clean-room
    load_rules:
      - .claude/rules/ip-clean-room.md
    paths_in_scope:
      - ".github/**"
      - "src/Explore.API/Dockerfile"
      - "src/Explore.Blazor/Dockerfile"
      - "Directory.Packages.props"
      - "global.json"
      - "docs/CI_CD_GOVERNANCE.md"
      - "docs/OPERATIONS.md"
      - "docs/TESTING.md"
      - "docs/RELEASE_CHECKLIST.md"
      - "docs/CONTRIBUTING.md"
