      - Explore.Blazor.Client.Tests
    docs_to_update: []
    unique_acceptance:
      - "Separate detail and collection policies per entity (do not reuse)"
      - "Authorization check encoded in the policy"
    forbidden_without_approval:
      - "Gating a UI button by role/claim instead of HAL link presence"
    related_agents:
      - presentation-engineer-agent
      - quality-verifier-agent

