  title: 'perf: db indexes to add'
  type: task
  description: '<p class="editor-paragraph-block" data-id="f5ae951e-c13b-4f3e-847f-b4250882376d">For
    Postgres, minimum practical indexes:</p><h3 class="editor-heading-block" data-id="4675637f-5540-4f23-89e5-a021a6721ed1">A.
    Foreign keys</h3><p class="editor-paragraph-block" data-id="c65fa6a0-a019-408f-bd4c-2e10b41583d0">Index
    every FK column used in joins (Postgres doesn’t auto-index them):</p><ul class="list-disc
    pl-7 space-y-(--list-spacing-y) tight" data-id="c8ed0c94-0feb-45a1-abe9-0f3f313b4d7b"
    data-tight="true"><li class="not-prose space-y-2" data-id="7ebd2390-d38c-4bfd-b211-f71de8f8520e"><p
    class="editor-paragraph-block" data-id="5d23c97f-d540-4dd0-9607-591f329b7957">event(tenant_id),
    event(actor_id), event(event_status_id), etc.</p></li><li class="not-prose space-y-2"
    data-id="4963e443-8162-4ce2-a98a-4149cd400e1c"><p class="editor-paragraph-block"
    data-id="641ee39e-280a-41ab-882e-9bfb754606e6">event_session(event_id), event_session(tenant_id),
    event_session(location_id)</p></li><li class="not-prose space-y-2" data-id="529614a7-96e1-4551-bff3-12838220b413"><p
    class="editor-paragraph-block" data-id="89397e42-5eae-43cb-8019-4d2556f6d19f">join
    tables: (event_id), (tag_id), (category_id) etc.</p></li></ul><h3 class="editor-heading-block"
    data-id="fc3870e3-cde2-4b64-b869-c9683ebfdc26">B. Search</h3><p class="editor-paragraph-block"
    data-id="9c947073-9b76-42ca-8c61-87570321ce5f">If you’ll do keyword search:</p><ul
    class="list-disc pl-7 space-y-(--list-spacing-y) tight" data-id="c0031fd7-65b9-4e69-a569-06a29f5b2151"
    data-tight="true"><li class="not-prose space-y-2" data-id="04301468-55e7-4d8b-a4bf-c7096a3f49d6"><p
    class="editor-paragraph-block" data-id="da90f118-36ed-457d-9ee5-8e86c2c72136">Add
    tsvector (or generated column) on event.title + event.description</p></li><li
    class="not-prose space-y-2" data-id="d0789dd0-6728-40a7-bc9e-192848034c69"><p
    class="editor-paragraph-block" data-id="753c777a-9068-47d9-a986-5214335b65c3">GIN
    index on it</p></li><li class="not-prose space-y-2" data-id="39aefc83-ae12-4007-9efa-14fade5cd4cb"><p
    class="editor-paragraph-block" data-id="3739e9f6-84b1-4c25-ace1-a0cedbc3336b">Also
    consider trigram index on title for “contains” search</p></li></ul><h3 class="editor-heading-block"
    data-id="e742c4a6-bdfe-41b5-abba-79bb0048e34b">C. Filtering paths</h3><p class="editor-paragraph-block"
    data-id="9c8b3fda-e250-4ed7-b3c7-93b146b35fa1">Common filters you listed suggest
    composite indexes like:</p><ul class="list-disc pl-7 space-y-(--list-spacing-y)
    tight" data-id="c42d302d-6658-4bc5-be8b-71da976a36c3" data-tight="true"><li class="not-prose
    space-y-2" data-id="73ff2439-dce0-466b-a02c-7d30fb48f935"><p class="editor-paragraph-block"
    data-id="7a3b451c-2acd-47ef-8fe6-1fe054918b77">event(tenant_id, visibility_type_id,
