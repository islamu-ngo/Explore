    data-id="fcfae29a-1075-4d23-8a1d-06e79f46ac0b">Prevent overlapping agenda items
    in the same session (very useful):</p></li></ol><ul class="list-disc pl-7 space-y-(--list-spacing-y)
    tight" data-id="e3d4df57-0e35-4c7f-8824-21711fe26141" data-tight="true"><li class="not-prose
    space-y-2" data-id="99087024-5be1-4bca-b147-388fa0986144"><p class="editor-paragraph-block"
