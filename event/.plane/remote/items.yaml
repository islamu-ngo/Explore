- id: EVENT-58
  title: Hybrid Caching
  type: task
  description: '<p class="editor-paragraph-block" data-id="5b492a4a-45a7-445d-a5ea-56b73ba0f3be"><span>In
    .NET, you usually have to choose between Speed and Consistency.<br><br>In-Memory
    Caching (IMemoryCache):</span></p><p class="editor-paragraph-block" data-id="b17f7103-82db-4678-b59d-bf2f4fdf2702"><span>
    Blazing fast (nanoseconds).<br> Data is stuck on one server. If you have 10 nodes,
    you have 10 caches.<br><br>Distributed Caching (IDistributedCache / Redis):<br>Shared
    across all servers. Consistent data.<br>Network latency. Serialization costs.
    It''s slower.<br><br>The Solution: HybridCache.<br><br>Don''t choose one. Use
    both.<br><br>A Hybrid Cache creates a tiered architecture:<br><br>- L1 (Local):
    The app checks RAM first. If it''s there, return instantly.<br>- L2 (Distributed):
    If missing locally, check Redis.<br>- Source: If missing in Redis, fetch from
    DB, then populate both L1 and L2.<br><br>While Microsoft is working on a native
    implementation, I still swear by FusionCache as the most robust, battle-tested
    library for this.<br><br>I wrote a guide on how to set this up properly: </span><a
    target="_blank" class="text-accent-secondary underline underline-offset-[3px]
    hover:text-accent-primary transition-colors cursor-pointer" href="https://lnkd.in/d6NKgMVp"
    rel="noopener noreferrer"><strong>https://lnkd.in/d6NKgMVp</strong></a></p>'
  state: Todo
  priority: none
  assignees:
  - e3d2b253-7b68-45e1-b101-1c21711c28b2
