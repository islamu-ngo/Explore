- id: EVENT-52
  title: Triggers for counter update in Event
  type: task
  description: '<h2 class="editor-heading-block" data-id="5fc2d726-2a83-4651-849b-cac43579b26f">Counters
    and derived fields: decide how they stay correct</h2><p class="editor-paragraph-block"
    data-id="29c8655d-a79f-4ae3-b47c-be0586bde8ad">You have several “derived” or “counter
    cache” fields:</p><ul class="list-disc pl-7 space-y-(--list-spacing-y) tight"
    data-id="20044f10-6e8f-499e-972c-32305fe701ec" data-tight="true"><li class="not-prose
    space-y-2" data-id="6d3422f5-094f-4526-bfe0-c7d9b08b4c29"><p class="editor-paragraph-block"
    data-id="b5dac63e-cc9f-48c5-811b-4285df2540c0">event.session_count</p></li><li
    class="not-prose space-y-2" data-id="c3fce04b-fd9f-40a2-b4fe-12af1aa66800"><p
    class="editor-paragraph-block" data-id="50292819-a8b0-4a2e-ac76-cad24bdad442">event.first_session_date,
    event.last_session_date</p></li><li class="not-prose space-y-2" data-id="17b933aa-e000-48fe-a5da-5491e3ce8630"><p
    class="editor-paragraph-block" data-id="2bc8de82-b212-49ad-b6d8-fd33586a9f19">event_session.current_audience_attendees</p></li><li
    class="not-prose space-y-2" data-id="7336feef-4716-42d1-a336-5f7cbc5d4db0"><p
    class="editor-paragraph-block" data-id="4a2ecd9f-e6d2-4774-9d7f-96574bf73847"><a
    target="_blank" class="text-accent-secondary underline underline-offset-[3px]
    hover:text-accent-primary transition-colors cursor-pointer" href="http://event.total"
    rel="noopener noreferrer">event.total</a>_views</p></li></ul><p class="editor-paragraph-block"
    data-id="c152bf95-550b-4bfd-98b8-c7d751a2252a">These are fine, but only if you
    define how they are maintained:</p><ul class="list-disc pl-7 space-y-(--list-spacing-y)
    tight" data-id="e3857b46-b485-4a13-8573-cd8b81ade50e" data-tight="true"><li class="not-prose
    space-y-2" data-id="9f055ab2-d969-4343-b36f-f3b65ec4592d"><p class="editor-paragraph-block"
    data-id="6e51f5ab-7422-4ca6-929f-1fde7d6811c7"><strong>Triggers</strong> (correctness
    first)</p></li><li class="not-prose space-y-2" data-id="13346dbf-7635-4777-8adc-46412568cfac"><p
    class="editor-paragraph-block" data-id="ffec6226-4bf1-44f4-8bf6-2fcd1a8a856a"><strong>Background
    job/materialized view</strong> (scalability first)</p></li><li class="not-prose
    space-y-2" data-id="1c02801c-7068-45c3-b400-e5481e9dc782"><p class="editor-paragraph-block"
    data-id="6cfb68ae-0e30-44f4-9d02-38a2421e0ef3"><strong>Application-only writes</strong>
    (most fragile)</p></li></ul><p class="editor-paragraph-block" data-id="d4d243cf-6783-431e-8bd6-537b53295597">If
    you want reliability, I’d do:</p><ul class="list-disc pl-7 space-y-(--list-spacing-y)
    tight" data-id="5f76a41f-4670-4628-b456-d41893bf7c64" data-tight="true"><li class="not-prose
    space-y-2" data-id="8e4e1701-0027-4409-9c63-92159ede82f4"><p class="editor-paragraph-block"
    data-id="9b58e1e9-95e7-46a6-8ec3-216865a43b8a">event.first_session_date/last_session_date/session_count
    maintained by trigger on event_session</p></li><li class="not-prose space-y-2"
    data-id="7e51ca3a-8706-4974-93ee-19af4fde6177"><p class="editor-paragraph-block"
    data-id="d3918286-a055-46b9-9496-873f4d4f29ae">current_audience_attendees maintained
    by trigger on event_registration (and enforce max constraint)</p></li></ul><p
    class="editor-paragraph-block" data-id="e4e8ed7f-78a0-47a7-a2bd-40a91ec5ad07">Also
    enforce:</p><ul class="list-disc pl-7 space-y-(--list-spacing-y) tight" data-id="b4c98bad-1896-48cf-9d1b-aa87f4ee6d7b"
    data-tight="true"><li class="not-prose space-y-2" data-id="4ed23680-3906-47ae-b2a4-3414b7fd5d02"><p
    class="editor-paragraph-block" data-id="9e1e4b4c-6a11-4d6b-881c-3971785fe684">event_registration
    unique per (user_id, event_session_id) to prevent double-RSVP</p></li></ul>'
  state: Backlog
  priority: none
  assignees:
  - e3d2b253-7b68-45e1-b101-1c21711c28b2
