// ABOUTME: Local copy of the upstream Osprey verdicts protobuf contract used by the coordinator gRPC client.
// ABOUTME: Keeps the generated client bounded to the minimal ProcessAction response types needed by moderation.
syntax = "proto3";

package osprey.rpc.common.v1;

option csharp_namespace = "Explore.Infrastructure.Osprey";

import "google/protobuf/timestamp.proto";

message Verdicts {
  uint64 action_id = 1;
  string action_name = 2;
  repeated string verdicts = 3;
  google.protobuf.Timestamp timestamp = 4;
}
