# ABOUTME: Minimal Prometheus configuration for the Aspire local-full profile.
# ABOUTME: Enables local scraping plus the OTLP receiver used by full-stack observability.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
