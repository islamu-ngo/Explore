    docs_to_update:
      - docs/AI_CONTEXT_SECURITY.md
      - dev/active/ai-context-disclosure-policy/field-classification-matrix.md
      - dev/active/ai-context-disclosure-policy/mcp-tool-audit.md
    unique_acceptance:
      - "AiContextDisclosureRegistry.CreateDefault() covers every public persisted property on every *Pii entity (reflection test passes)"
      - "IAiContextGateway is the only path to disclose entity fields to the AI prompt (bypass test passes)"
      - "No direct PII entity references in Features/AiAssistant/** or src/Explore.API/Mcp/** (architecture test passes)"
      - "MaxAiContextSensitivity and PiiDisclosureEnabled settings exist and default to restrictive values"
