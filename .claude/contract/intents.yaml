      - "Every resource linked from SKILL.md or resources/index.md exists and has two ABOUTME lines"
      - "The skill states activation boundaries, anti-patterns, verification hooks, and output contract clearly enough for another agent to use without rereading the originating chat"
    forbidden_without_approval:
      - "Creating a skill that claims authority beyond its evidence or domain scope"
      - "Inlining long framework material in SKILL.md instead of resource files"
    related_agents:
      - architect-agent
      - librarian-agent
      - quality-verifier-agent

