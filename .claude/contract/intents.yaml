      - src/Explore.API/Mcp/McpAdapterTelemetry.cs
      - tests/Event.Architecture.Tests/AiContextDisclosureSchemaTests.cs
      - tests/Event.Architecture.Tests/AiContextGatewayBypassTests.cs
      - docs/AI_CONTEXT_SECURITY.md
      - docs/adr/ADR-012-ai-context-disclosure-policy.md
