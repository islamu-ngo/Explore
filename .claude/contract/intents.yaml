# ABOUTME: Canonical intent catalog for the Contribution Contract.
# ABOUTME: Each entry is a machine-readable answer to the 8 contract questions for one category of change.

version: 1

intents:
  - id: add-get-endpoint
    title: "Add a new GET endpoint to the public API"
    category: api
    triggers:
      - "add a new GET endpoint"
      - "expose a new read endpoint"
      - "new query endpoint"
    must_read_docs:
      - docs/API.md
      - docs/QUICK_REFERENCE.md
    load_skills:
      - cqrs-mediatr-guidelines
    load_rules:
      - .claude/rules/api-controllers.md
    paths_in_scope:
      - "Explore.API/Controllers/**/*.cs"
      - "Explore.Application/Features/**/Queries/**/*.cs"
    minimum_tests:
      - Event.API.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - docs/API_CHANGELOG.md
    unique_acceptance:
      - "Output cache policy applied if appropriate"
      - "HAL link policy updated if response is a resource"
    forbidden_without_approval:
      - "Removing or renaming an existing endpoint"
    related_agents:
      - architect-agent
      - presentation-engineer-agent
      - quality-verifier-agent

  - id: add-write-endpoint
    title: "Add a new POST/PUT/PATCH/DELETE endpoint to the public API"
    category: api
    triggers:
      - "add a new POST endpoint"
      - "add a create endpoint"
      - "add an update endpoint"
      - "add a delete endpoint"
    must_read_docs:
      - docs/API.md
      - docs/QUICK_REFERENCE.md
      - docs/SECURITY-MODEL.md
    load_skills:
      - cqrs-mediatr-guidelines
      - auth-patterns
    load_rules:
      - .claude/rules/api-controllers.md
    paths_in_scope:
      - "Explore.API/Controllers/**/*.cs"
      - "Explore.Application/Features/**/Commands/**/*.cs"
    minimum_tests:
      - Event.API.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - docs/API_CHANGELOG.md
    unique_acceptance:
      - "Rate limiter policy applied"
      - "Idempotency considered"
      - "HAL link policy updated to expose/hide this affordance"
    forbidden_without_approval:
      - "Removing [Authorize] from a write endpoint"
    related_agents:
      - architect-agent
      - presentation-engineer-agent
      - backend-engineer-agent
      - quality-verifier-agent

  - id: add-hal-link
    title: "Add or modify a HAL link/affordance on an existing resource"
    category: api
    triggers:
      - "add a HAL link"
      - "expose edit affordance"
      - "add hateoas link"
    must_read_docs:
      - docs/API.md
      - docs/QUICK_REFERENCE.md
    load_skills: []
    load_rules:
      - .claude/rules/api-hateoas.md
    paths_in_scope:
      - "Explore.API/Hateoas/**/*.cs"
      - "Explore.Blazor.Client/**/*.razor"
    minimum_tests:
      - Event.API.IntegrationTests
      - Explore.Blazor.Client.Tests
    docs_to_update: []
    unique_acceptance:
      - "Separate detail and collection policies per entity (do not reuse)"
      - "Authorization check encoded in the policy"
    forbidden_without_approval:
      - "Gating a UI button by role/claim instead of HAL link presence"
    related_agents:
      - presentation-engineer-agent
      - quality-verifier-agent

  - id: add-cqrs-handler
    title: "Add a new Command or Query handler in the Application layer"
    category: application
    triggers:
      - "add a new handler"
      - "new CQRS handler"
    must_read_docs:
      - docs/ARCHITECTURE.md
      - docs/QUICK_REFERENCE.md
    load_skills:
      - cqrs-mediatr-guidelines
    load_rules:
      - .claude/rules/application-layer.md
    paths_in_scope:
      - "Explore.Application/Features/**/*.cs"
    minimum_tests:
      - Event.Application.UnitTests
      - Event.Architecture.Tests
    docs_to_update: []
    unique_acceptance:
      - "Pipeline behaviors respected (validation, logging, caching, idempotency)"
    forbidden_without_approval:
      - "Cross-feature coupling (handler reaching into another feature's internals)"
    related_agents:
      - backend-engineer-agent
      - quality-verifier-agent

  - id: add-ef-migration
    title: "Add or modify an Entity Framework Core migration"
    category: persistence
    triggers:
      - "add an EF migration"
      - "schema change"
    must_read_docs:
      - docs/QUICK_REFERENCE.md
      - docs/DOMAIN.md
    load_skills:
      - dotnet-efcore-guidelines
    load_rules:
      - .claude/rules/efcore-migrations.md
    paths_in_scope:
      - "Explore.Persistence/Migrations/**/*.cs"
      - "Explore.Domain/**/*.cs"
    minimum_tests:
      - Event.Persistence.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - schemas/islamu-event.md
    unique_acceptance:
      - "Migration is idempotent and reversible"
      - "HasData seed synchronized with enum values"
    forbidden_without_approval:
      - "Destructive Down() that silently loses data"
    related_agents:
      - backend-engineer-agent
      - quality-verifier-agent

  - id: update-repository-query
    title: "Modify an existing repository query or specification"
    category: persistence
    triggers:
      - "update repository query"
      - "change specification"
    must_read_docs:
      - docs/QUICK_REFERENCE.md
    load_skills:
      - dotnet-efcore-guidelines
    load_rules:
      - .claude/rules/efcore-persistence.md
    paths_in_scope:
      - "Explore.Persistence/Repositories/**/*.cs"
    minimum_tests:
      - Event.Persistence.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update: []
    unique_acceptance:
      - "EventQuerySpecification mutations create new instances"
      - "Navigation loading is explicit"
    forbidden_without_approval:
      - "IgnoreQueryFilters() without a test proving safety"
    related_agents:
      - backend-engineer-agent
      - quality-verifier-agent

  - id: blazor-component-affordance
    title: "Toggle a Blazor component's mutation affordance"
    category: blazor
    triggers:
      - "show edit button when"
      - "hide delete button"
    must_read_docs:
      - docs/BLAZOR.md
      - docs/QUICK_REFERENCE.md
    load_skills:
      - blazor-ui-conventions
    load_rules:
      - .claude/rules/blazor-client.md
    paths_in_scope:
      - "Explore.Blazor.Client/**/*.razor"
    minimum_tests:
      - Explore.Blazor.Client.Tests
    docs_to_update: []
    unique_acceptance:
      - 'Button visibility gated by dto.HasHalLink("edit") / dto.HasHalLink("delete") helpers'
    forbidden_without_approval:
      - "Introducing ad-hoc role checks for per-resource actions"
    related_agents:
      - presentation-engineer-agent
      - quality-verifier-agent

  - id: bff-auth-bug
    title: "Debug and fix a BFF authentication bug"
    category: auth
    triggers:
      - "auth not working"
      - "BFF auth bug"
    must_read_docs:
      - docs/SECURITY-MODEL.md
      - docs/BLAZOR.md
    load_skills:
      - blazor-bff-patterns
    load_rules:
      - .claude/rules/blazor-server.md
    paths_in_scope:
      - "Explore.Blazor/**/*.cs"
    minimum_tests:
      - Explore.Blazor.IntegrationTests
    docs_to_update: []
    unique_acceptance:
      - "UserId extraction fallback order preserved"
      - "Token forwarding via YARP transform is intact"
    forbidden_without_approval:
      - "Disabling HTTPS or cookie SameSite protections"
    related_agents:
      - presentation-engineer-agent
      - quality-verifier-agent

  - id: cerbos-policy-change
    title: "Change Cerbos authorization policies"
    category: authorization
    triggers:
      - "cerbos policy"
      - "update permission"
    must_read_docs:
      - docs/SECURITY-MODEL.md
      - docs/AUTHORIZATION.md
    load_skills: []
    load_rules: []
    paths_in_scope:
      - "cerbos/**"
    minimum_tests:
      - Event.API.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - docs/AUTHORIZATION.md
    unique_acceptance:
      - "Cerbos policy-check workflow passes"
      - "AuthorizationParityTests passes"
    forbidden_without_approval:
      - "Widening permissions without explicit user approval"
    related_agents:
      - backend-engineer-agent
      - quality-verifier-agent

  - id: openapi-contract-change
    title: "Change the public API contract"
    category: api
    triggers:
      - "api contract change"
      - "openapi change"
    must_read_docs:
      - docs/API.md
      - docs/QUICK_REFERENCE.md
    load_skills: []
    load_rules:
      - .claude/rules/api-controllers.md
    paths_in_scope:
      - "Explore.API/Controllers/**/*.cs"
      - "docs/API_CHANGELOG.md"
    minimum_tests:
      - Event.API.IntegrationTests
      - Event.Architecture.Tests
    docs_to_update:
      - docs/API_CHANGELOG.md
    unique_acceptance:
      - "Operation IDs follow naming convention"
    forbidden_without_approval:
      - "Breaking change without explicit user approval"
    related_agents:
      - presentation-engineer-agent
      - librarian-agent
      - quality-verifier-agent

  - id: ci-cd-change
    title: "Change CI/CD workflows, deployment automation, or release governance"
    category: infrastructure
    triggers:
      - "change GitHub Actions workflow"
      - "update CI/CD pipeline"
      - "harden deployment workflow"
      - "change release governance"
    must_read_docs:
      - docs/CI_CD_GOVERNANCE.md
      - docs/OPERATIONS.md
      - docs/TESTING.md
      - docs/RELEASE_CHECKLIST.md
      - docs/QUICK_REFERENCE.md
    load_skills: []
    load_rules: []
    paths_in_scope:
      - ".github/**"
      - "Explore.API/Dockerfile"
      - "Explore.Blazor/Dockerfile"
      - "Directory.Packages.props"
      - "global.json"
      - "docs/CI_CD_GOVERNANCE.md"
      - "docs/OPERATIONS.md"
      - "docs/TESTING.md"
      - "docs/RELEASE_CHECKLIST.md"
      - "docs/CONTRIBUTING.md"
    minimum_tests:
      - Event.Architecture.Tests
    docs_to_update:
      - docs/CI_CD_GOVERNANCE.md
      - docs/OPERATIONS.md
      - docs/RELEASE_CHECKLIST.md
    unique_acceptance:
      - "External GitHub Actions remain pinned to full commit SHAs with same-line version comments"
      - "Required checks are always-present or explicitly documented as path-conditional"
      - "Deployment changes retain protected environment approval and release evidence"
    forbidden_without_approval:
      - "Introducing pull_request_target outside a documented metadata-only legal/status workflow threat model"
      - "Granting write-token, package, OIDC, registry, or deployment credentials to fork PR code"
      - "Renaming required workflows or jobs without branch-protection migration evidence"
    related_agents:
      - architect-agent
      - quality-verifier-agent

  - id: external-infrastructure-bootstrap
    title: "Automate external infrastructure bootstrap or onboarding"
    category: infrastructure
    triggers:
      - "bootstrap external infrastructure"
      - "automate Keycloak bootstrap"
      - "configure existing Keycloak"
      - "setup-time infrastructure onboarding"
      - "external provider bootstrap"
    must_read_docs:
      - docs/QUICK_REFERENCE.md
      - docs/GOVERNANCE.md
      - docs/SECURITY-MODEL.md
      - docs/SECRETS.md
      - docs/CONFIGURATION.md
      - docs/SELF_HOSTING.md
      - docs/TESTING.md
    load_skills:
      - auth-patterns
      - blazor-bff-patterns
      - clean-architecture-rules
    load_rules:
      - .claude/rules/api-controllers.md
      - .claude/rules/application-layer.md
      - .claude/rules/blazor-server.md
      - .claude/rules/blazor-client.md
      - .claude/rules/tests.md
    paths_in_scope:
      - "docker-compose.yml"
      - "docker/**"
      - "Explore.Application/Contracts/Services/**/*.cs"
      - "Explore.Application/DTOs/Onboarding/**/*.cs"
      - "Explore.Application/Features/InstanceOnboarding/**/*.cs"
      - "Explore.Infrastructure/Services/**/*.cs"
      - "Explore.Infrastructure/InfrastructureServicesRegistration.cs"
      - "Explore.API/Controllers/**/*Settings*.cs"
      - "Explore.API/Controllers/**/*Onboarding*.cs"
      - "Explore.API/Hateoas/RouteNames.cs"
      - "Explore.Blazor/**/*.cs"
      - "Explore.Blazor.Client/**/*.razor"
      - "Explore.Blazor.Client/Services/**/*.cs"
      - "Event.*Tests/**/*.cs"
      - "Explore.*Tests/**/*.cs"
      - "docs/CONFIGURATION.md"
      - "docs/SECRETS.md"
      - "docs/SELF_HOSTING.md"
      - "docs/TROUBLESHOOTING.md"
      - "dev/active/**"
    minimum_tests:
      - Event.Application.UnitTests
      - Event.API.IntegrationTests
      - Explore.Blazor.IntegrationTests
      - Explore.Blazor.Client.Tests
      - Event.Architecture.Tests
    docs_to_update:
      - docs/CONFIGURATION.md
      - docs/SECRETS.md
      - docs/SELF_HOSTING.md
      - docs/TROUBLESHOOTING.md
    unique_acceptance:
      - "Bootstrap credentials are request-scoped or job-scoped and never persisted as runtime application secrets"
      - "Browser-controlled privileged headers are stripped and replaced only from trusted BFF/server sources"
      - "External-provider admin API responses, tokens, passwords, and client secrets stay out of logs, DTOs, traces, and support artifacts"
      - "Existing external resources are patched additively; destructive delete/reimport workflows require explicit approval"
      - "Operator docs cover rerun, rotation, backup, and failure recovery paths"
    forbidden_without_approval:
      - "Persisting provider admin credentials or service-account secrets for background reuse"
      - "Deleting or reimporting an existing external realm/resource as a repair strategy"
      - "Trusting browser-supplied setup/admin headers for bootstrap authority"
      - "Silently overriding deployment-managed secrets with application-managed values"
    related_agents:
      - architect-agent
      - backend-engineer-agent
      - presentation-engineer-agent
      - quality-verifier-agent

  - id: create-agent-context-skill
    title: "Create or update an agent-context skill"
    category: cross-cutting
    triggers:
      - "create a skill"
      - "write a skill"
      - "add a .claude skill"
      - "update skill resources"
      - "agentic engineering"
      - "context engineering"
    must_read_docs:
      - AGENTS.md
      - docs/QUICK_REFERENCE.md
      - docs/DOCUMENTATION_STYLE_GUIDE.md
      - docs/OPERATIONS.md
      - docs/TESTING.md
      - .agents/skills/_SKILL_SCHEMA.md
    load_skills:
      - skill-authoring
      - agentic-research
      - senior-cto-feedback
    load_rules: []
    paths_in_scope:
      - ".agents/skills/"
      - ".claude/contract/"
      - "Event.Architecture.Tests/"
      - "dev/active/"
    minimum_tests:
      - Event.Architecture.Tests
    docs_to_update:
      - .claude/contract/intents.yaml
      - .agents/skills/_SKILL_SCHEMA.md
    unique_acceptance:
      - "New SKILL.md satisfies the skill schema without adding a schema-test skip exception"
      - "Every resource linked from SKILL.md or resources/index.md exists and has two ABOUTME lines"
      - "The skill states activation boundaries, anti-patterns, verification hooks, and output contract clearly enough for another agent to use without rereading the originating chat"
    forbidden_without_approval:
      - "Adding a new skill to AgentContextSchemaTests.SkipSchemaMigration"
      - "Creating a skill that claims authority beyond its evidence or domain scope"
      - "Inlining long framework material in SKILL.md instead of resource files"
    related_agents:
      - architect-agent
      - librarian-agent
      - quality-verifier-agent

  - id: update-ai-context-disclosure
    title: "Update or extend the AI Context Disclosure Policy"
    category: cross-cutting
    triggers:
      - ai context disclosure
      - ai pii disclosure
      - ai consent grant
      - ai context gateway
      - ai sensitivity classification
      - "update.*ai.*disclosure"
      - "ai.*redaction"
      - "ai.*consent"
    must_read_docs:
      - docs/AI_CONTEXT_SECURITY.md
      - docs/adr/ADR-012-ai-context-disclosure-policy.md
      - dev/active/ai-context-disclosure-policy/field-classification-matrix.md
      - dev/active/ai-context-disclosure-policy/ai-context-disclosure-policy-plan.md
      - AGENTS.md
      - docs/SECURITY-MODEL.md
      - docs/AUTHORIZATION.md
    load_skills:
      - clean-architecture-rules
      - cqrs-mediatr-guidelines
      - auth-patterns
    load_rules:
      - .claude/rules/application-layer.md
      - .claude/rules/efcore-persistence.md
      - .claude/rules/tests.md
    paths_in_scope:
      - Explore.Domain/Enums/Ai*.cs
      - Explore.Domain/AiConsentGrant.cs
      - Explore.Application/Features/AiAssistant/Disclosure/**
      - Explore.Application/Features/AiAssistant/Requests/Commands/Grant*Consent*.cs
      - Explore.Application/Features/AiAssistant/Requests/Commands/Revoke*Consent*.cs
      - Explore.Application/Features/AiAssistant/Handlers/Commands/Grant*Consent*.cs
      - Explore.Application/Features/AiAssistant/Handlers/Commands/Revoke*Consent*.cs
      - Explore.Application/Contracts/Persistence/IAiConsentGrantRepository.cs
      - Explore.Persistence/Repositories/AiConsentGrantRepository.cs
      - Explore.Persistence/EntityTypeConfigurations/AiConsentGrantConfiguration.cs
      - Explore.Application/Features/AiAssistant/Handlers/Commands/ProcessAiRunCommandHandler.cs
      - Explore.Application/Settings/Groups/AiAssistantSettingGroup.cs
      - Explore.Domain/Constants/GovernanceSettingKeys.cs
      - Explore.API/Mcp/AiAssistantMcp*.cs
      - Explore.API/Mcp/McpAdapterTelemetry.cs
      - Event.Architecture.Tests/AiContextDisclosureSchemaTests.cs
      - Event.Architecture.Tests/AiContextGatewayBypassTests.cs
      - docs/AI_CONTEXT_SECURITY.md
      - docs/adr/ADR-012-ai-context-disclosure-policy.md
    minimum_tests:
      - Event.Architecture.Tests
    docs_to_update:
      - docs/AI_CONTEXT_SECURITY.md
      - dev/active/ai-context-disclosure-policy/field-classification-matrix.md
      - dev/active/ai-context-disclosure-policy/mcp-tool-audit.md
    unique_acceptance:
      - "AiContextDisclosureRegistry.CreateDefault() covers every public persisted property on every *Pii entity (reflection test passes)"
      - "IAiContextGateway is the only path to disclose entity fields to the AI prompt (bypass test passes)"
      - "No direct PII entity references in Features/AiAssistant/** or Explore.API/Mcp/** (architecture test passes)"
      - "MaxAiContextSensitivity and PiiDisclosureEnabled settings exist and default to restrictive values"
      - "Build is green across Domain, Application, Persistence, and Architecture.Tests"
    forbidden_without_approval:
      - "Removing a field from AiContextDisclosureRegistry without updating field-classification-matrix.md"
      - "Setting PiiDisclosureEnabled default to true"
      - "Bypassing IAiContextGateway in any AI flow path"
      - "Adding a new *Pii entity without registering its fields"
      - "Changing MaxAiContextSensitivity default above Internal"
    related_agents:
      - architect-agent
      - backend-engineer-agent
      - quality-verifier-agent
