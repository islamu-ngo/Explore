# ABOUTME: Tangled Spindle CI adapter for mirrored repositories.
# ABOUTME: Runs repository restore, Release build, and architecture smoke tests through Nixery.

when:
  - event: ["push", "manual"]
    branch: ["main", "develop"]
  - event: ["pull_request"]
    branch: ["main", "develop"]

engine: "nixery"

clone:
  skip: false
  depth: 1
  submodules: false

dependencies:
  nixpkgs:
    - dotnet-sdk_10

steps:
  - name: "Restore"
    command: "dotnet restore --locked-mode"
  - name: "Build"
    command: "dotnet build --configuration Release --no-restore --verbosity minimal"
  - name: "Architecture tests"
    command: "dotnet test --project Event.Architecture.Tests/Event.Architecture.Tests.csproj --configuration Release --no-build --verbosity minimal"
