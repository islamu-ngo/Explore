# ABOUTME: Docker Compose topology for the ISLAMU Event platform.
# ABOUTME: Uses PostgreSQL plus a durable local storage volume by default; MinIO remains opt-in.

name: islamu-event-platform

x-keycloak-env: &keycloak-env
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ISLAMU}
  KEYCLOAK_ENDPOINT: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  Keycloak__RequireHttpsMetadata: ${KEYCLOAK_REQUIRE_HTTPS_METADATA:-false}

# Secret management bootstrap configuration (optional).
# When set, BootstrapSecretLoader resolves POSTGRESQL_* from the `/postgresql` Infisical folder
# before falling back to the discrete env vars below. Leave blank for zero-secret deployments.
x-secrets-env: &secrets-env
  SecretProvider__Provider: ${SECRET_PROVIDER:-None}
  SecretProvider__Infisical__Url: ${INFISICAL_URL:-https://app.infisical.com}
  SecretProvider__Infisical__ProjectId: ${INFISICAL_PROJECT_ID:-}
  SecretProvider__Infisical__ClientId: ${INFISICAL_CLIENT_ID:-}
  SecretProvider__Infisical__ClientSecret: ${INFISICAL_CLIENT_SECRET:-}
  SecretProvider__Infisical__Environment: ${INFISICAL_ENV:-dev}

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-explore}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-explore}
  POSTGRES_DB: ${POSTGRES_DB:-explore}

# Discrete Postgres credentials consumed by BootstrapSecretLoader.
# Never pre-build ConnectionStrings__DefaultConnection here - the loader composes the string.
x-postgres-bootstrap-env: &postgres-bootstrap-env
  POSTGRESQL_HOST: ${POSTGRESQL_HOST:-postgres}
  POSTGRESQL_PORT: ${POSTGRESQL_PORT:-5432}
  POSTGRESQL_DATABASE: ${POSTGRES_DB:-explore}
  POSTGRESQL_USERNAME: ${POSTGRES_USER:-explore}
  POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-explore}

x-s3-env: &s3-env
  S3Settings__Endpoint: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
  S3Settings__PublicEndpoint: ${S3_PUBLIC_ENDPOINT:-http://minio.localhost:9000}
  S3Settings__Region: ${S3_REGION:-us-east-1}
  S3Settings__BucketName: ${S3_BUCKET_NAME:-explore}
  S3Settings__AccessKeyId: ${S3_ACCESS_KEY_ID:-minioadmin}
  S3Settings__SecretAccessKey: ${S3_SECRET_ACCESS_KEY:-minioadmin}

x-local-storage-env: &local-storage-env
  Storage__Local__RootPath: ${LOCAL_STORAGE_ROOT_PATH:-/app/storage-data/local}
  Storage__Local__CreateRootIfMissing: ${LOCAL_STORAGE_CREATE_ROOT_IF_MISSING:-true}
  StorageReconciliation__Enabled: ${STORAGE_RECONCILIATION_ENABLED:-true}
  StorageReconciliation__DryRun: ${STORAGE_RECONCILIATION_DRY_RUN:-true}
  StorageReconciliation__QuarantineMissingObjects: ${STORAGE_RECONCILIATION_QUARANTINE_MISSING_OBJECTS:-false}
  StorageReconciliation__QuarantineOrphanLocalFiles: ${STORAGE_RECONCILIATION_QUARANTINE_ORPHAN_LOCAL_FILES:-false}
  StorageReconciliation__DeleteQuarantinedObjects: ${STORAGE_RECONCILIATION_DELETE_QUARANTINED_OBJECTS:-false}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      <<: *postgres-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}
      KC_HOSTNAME_URL: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 10s
      retries: 15 # Give it more attempts
      start_period: 60s # Give it a full minute to do the heavy lifting
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-init:
    image: quay.io/keycloak/keycloak:26.1.2
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ISLAMU}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_BLAZOR_CLIENT_ID: islamu-event-blazor
      KEYCLOAK_BLAZOR_CLIENT_SECRET: ${KEYCLOAK_BLAZOR_CLIENT_SECRET:-}
      KEYCLOAK_API_CLIENT_ID: islamu-event-api
      KEYCLOAK_API_CLIENT_SECRET: ${KEYCLOAK_API_CLIENT_SECRET:-}
      KEYCLOAK_INIT_ALLOW_DEFAULT_LOCAL_SECRET: ${KEYCLOAK_INIT_ALLOW_DEFAULT_LOCAL_SECRET:-false}
    volumes:
      - ./docker/keycloak/keycloak-init.sh:/opt/keycloak/bin/keycloak-init.sh:ro
    entrypoint: ["/bin/bash", "/opt/keycloak/bin/keycloak-init.sh"]

  islamu-event-api:
    build:
      context: .
      dockerfile: Explore.API/Dockerfile
    environment:
      <<: [*keycloak-env, *s3-env, *local-storage-env, *secrets-env, *postgres-bootstrap-env]
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-}
      Keycloak__MetadataAddress: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/${KEYCLOAK_REALM:-ISLAMU}/.well-known/openid-configuration
      Keycloak__Authority: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}/realms/${KEYCLOAK_REALM:-ISLAMU}
      ConnectionStrings__cache: ${REDIS_CONNECTION_STRING:-redis:6379}
      Cerbos__GrpcEndpoint: ${CERBOS_GRPC_ENDPOINT:-http://cerbos:3593}
      Cerbos__PlaintextMode: ${CERBOS_PLAINTEXT_MODE:-true}
      Cerbos__PolicyPackagePath: /app/cerbos/policies
      Cerbos__AdminApi__Endpoints__0: ${CERBOS_ADMIN_API_ENDPOINT:-http://cerbos:3592}
      Cerbos__AdminApi__AdminUsername: ${CERBOS_ADMIN_USER:-cerbos}
      Cerbos__AdminApi__AdminPassword: ${CERBOS_ADMIN_PASSWORD:-}
    ports:
      - "7039:8080"
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "minio.localhost:host-gateway"
    volumes:
      - ./cerbos/policies:/app/cerbos/policies:ro
      - local_storage_data:/app/storage-data/local
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
        required: false # API starts even if MinIO is not in the active profile

  islamu-event-ui:
    build:
      context: .
      dockerfile: Explore.Blazor/Dockerfile
    environment:
      <<: [*keycloak-env, *secrets-env, *postgres-bootstrap-env]
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      API_ENDPOINT: ${API_ENDPOINT:-http://islamu-event-api:8080/}
      Keycloak__Authority: ${KEYCLOAK_ENDPOINT:-http://keycloak.localhost:8080}/realms/${KEYCLOAK_REALM:-ISLAMU}
      Keycloak__MetadataAddress: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/${KEYCLOAK_REALM:-ISLAMU}/.well-known/openid-configuration
      Keycloak__Realm: ${KEYCLOAK_REALM:-ISLAMU}
      Keycloak__ClientId: islamu-event-blazor
      Keycloak__ClientSecret: ${KEYCLOAK_BLAZOR_CLIENT_SECRET:-islamu-event-blazor-secret}
      ConnectionStrings__cache: ${REDIS_CONNECTION_STRING:-redis:6379}
    ports:
      - "7002:8080"
    extra_hosts:
      - "keycloak.localhost:host-gateway"
      - "minio.localhost:host-gateway"
    depends_on:
      islamu-event-api:
        condition: service_started
      keycloak:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
        required: false

  minio:
    image: ghcr.io/coollabsio/minio:latest
    profiles: ["storage"] # Opt-in only
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      MINIO_SERVER_URL: ${S3_PUBLIC_ENDPOINT:-http://minio.localhost:9000}
    volumes:
      - minio_data:/data
    ports:
      - "9005:9000" # CHANGED TO 9005 TO AVOID CONFLICT
      - "9006:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    profiles: ["storage"] # Only runs if storage is enabled
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET_NAME:-explore};
      mc anonymous set public local/${S3_BUCKET_NAME:-explore};
      "

  cerbos-db:
    image: postgres:18-alpine
    profiles: ["authz"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CERBOS_POSTGRES_USER:-cerbos_user}
      POSTGRES_PASSWORD: ${CERBOS_POSTGRES_PASSWORD:-cerbos_password}
      POSTGRES_DB: ${CERBOS_POSTGRES_DB:-cerbos}
    volumes:
      - cerbos_data:/var/lib/postgresql/data
      - ./cerbos/init/cerbos-schema.sql:/docker-entrypoint-initdb.d/cerbos-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  cerbos:
    image: ghcr.io/cerbos/cerbos:0.53.0
    profiles: ["authz"] # Opt-in only (use: docker compose --profile authz up)
    restart: unless-stopped
    command: ["server", "--config=/config/.cerbos.yaml"]
    environment:
      CERBOS_ADMIN_USER: ${CERBOS_ADMIN_USER:-cerbos}
      CERBOS_ADMIN_PASSWORD_HASH: ${CERBOS_ADMIN_PASSWORD_HASH:-}
      CERBOS_PG_URL: ${CERBOS_PG_URL:-postgres://cerbos_user:cerbos_password@cerbos-db:5432/cerbos?search_path=cerbos&sslmode=disable}
    volumes:
      - ./cerbos/config/.cerbos.yaml:/config/.cerbos.yaml:ro
      - ./cerbos/policies:/policies:ro
    ports:
      - "3592:3592" # HTTP/Admin API
      - "3593:3593" # gRPC PDP
    depends_on:
      cerbos-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3592/_cerbos/health"]
      interval: 5s
      retries: 5

  cerbos-policy-sync:
    image: ghcr.io/cerbos/cerbosctl:0.53.0
    profiles: ["authz"]
    depends_on:
      cerbos:
        condition: service_healthy
    environment:
      CERBOS_USERNAME: ${CERBOS_ADMIN_USER:-cerbos}
      CERBOS_PASSWORD: ${CERBOS_ADMIN_PASSWORD:-}
    volumes:
      - ./cerbos/policies:/policies:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      cerbosctl --server=http://cerbos:3592 put policy --recursive /policies &&
      cerbosctl --server=http://cerbos:3592 put schema --recursive /policies/_schemas &&
      cerbosctl --server=http://cerbos:3592 store reload --wait

volumes:
  postgres_data:
  redis_data:
  keycloak_data:
  local_storage_data:
  minio_data:
  cerbos_data:
