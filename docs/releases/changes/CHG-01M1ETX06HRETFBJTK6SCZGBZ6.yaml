# ABOUTME: Public change fragment for the typed headless bootstrap lifecycle and schema.
# ABOUTME: Records the breaking persistence replacement and generator-owned backfill ordering.
Change-Id: CHG-01M1ETX06HRETFBJTK6SCZGBZ6
Title: "Typed headless bootstrap lifecycle"
Type: feat
Scope: self-hosting
Summary: "Instance bootstrap state is persisted as a typed lifecycle with status, mode, provider, deployment, generation, fingerprints, timestamps, and local completion lineage."
Group: headless-instance-onboarding
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      The boolean completion flag and the persisted selected deployment mode
      are removed from bootstrap storage. No legacy reader or compatibility
      shim remains, so every consumer must read the typed lifecycle columns.
  Security:
    Reference: docs/SECURITY_OVERVIEW.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Lifecycle rows carry fingerprints and value-free lineage only; no
      configured identity values, secrets, or operator identifiers are stored.
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: documented
    Detail: >-
      Generated migrations for PostgreSQL, SQLite, SQL Server, MariaDB, and
      MySQL replace the removed columns and backfill the typed lifecycle in
      generator-owned deterministic order, so replays converge on one result.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      Deployment mode is resolved from configuration at startup instead of
      being read back from persisted bootstrap state.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Bootstrap status exposes additive typed state, mode, provider, and
      generation fields; routes and operation identifiers are unchanged.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Apply the generated migration for the selected provider before starting
      the upgraded instance. Rolling back requires restoring the pre-migration
      backup, because the removed columns cannot be reconstructed from the
      typed lifecycle alone.
