# ABOUTME: Public change fragment generated with its collision-resistant commit footer.
# ABOUTME: Records release impact defaults for review before the owning commit is shared.
Change-Id: CHG-01M1A7E5TMP1B5DXXD1C5EW9MW
Title: "Add reviewed configuration portability"
Type: feat
Scope: self-hosting
Summary: "Administrators can migrate v1alpha2 instance and tenant configuration through preview, atomic apply, receipts, and forward rollback."
Group: configuration-portability
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      The v1alpha1 schema and media identities are removed. Consumers must use
      the strict v1alpha2 ConfigurationManifest or TenantConfigurationPackage;
      no compatibility reader, alias, or transition endpoint is retained.
  Security:
    Reference: docs/SECURITY_OVERVIEW.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Import and transfer are route-authorized, HAL-gated, private/no-store,
      bounded, replay-fenced, tenant-isolated, secret-free, and applied only
      after a fresh server-authoritative preview under ordered locks.
  Migration:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Generated migrations for PostgreSQL, SQLite, SQL Server, MariaDB, and
      MySQL add import sessions, protected artifacts, append-only operations,
      direct-transfer sessions/chunks, and managed apply schedules. Operators
      apply the matching provider migration before enabling portability.
  Configuration:
    Reference: docs/CONFIGURATION_MANIFEST.md
    Disposition: documented
    Detail: >-
      Portability introduces no secret configuration. Artifacts explicitly
      omit secrets, PII, provider bindings, operational state, application
      data, and deployment topology; target setup remains independently owned.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      OpenAPI and the generated Blazor client include instance and tenant
      export, session, preview, apply, receipt, history, rollback, cancellation,
      direct-transfer, and managed schedule contracts.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Operators retain source artifacts and receipts, distinguish committed
      configuration from pending effects, use forward rollback while snapshots
      remain available, monitor bounded retention cleanup, require distinct
      uploader/reviewer/applier identities for managed windows, and never treat
      portability as data migration or backup.
