# ABOUTME: Public change fragment for configured administrator activation at startup.
# ABOUTME: Records the exact configuration surface, ordering, routing, and recovery behavior.
Change-Id: CHG-01M1EQWDAHHXQ3AD29B4Y0645B
Title: "Configured administrator activation"
Type: feat
Scope: self-hosting
Summary: "A configured administrator is prepared during startup and claimed on first successful provider sign-in, so a headless instance needs no interactive onboarding."
Group: headless-instance-onboarding
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/SELF_HOSTING.md
    Disposition: not-applicable
  Security:
    Reference: docs/SECURITY_OVERVIEW.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Preparation only records intent; authority is granted after the
      configured provider authenticates and the claim is finalized. A claimed
      administrator is final and cannot be silently re-pointed by editing
      configuration. Status fields stay additive and value-free.
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: not-applicable
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: documented
    Detail: >-
      Activation reads exactly seven keys and rejects unknown or partial
      combinations. Split deployments complete migration and manifest work
      before API preparation, and the browser-facing BFF waits for API
      readiness. Standalone evaluates the same order within one origin.
      Routing follows the configured BFF and provider endpoints.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: documented
    Detail: >-
      Instance status gains additive value-free activation fields; no new
      write endpoint is introduced and existing routes are unchanged.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Set the activation keys before first start and sign in once with the
      configured provider account. The Setup Assistant and its manifest stay
      offline and identity-free. Recovery from a lost administrator account
      requires a restored backup, since the claim is final once completed.
