# ABOUTME: Public change fragment for explicit configured-administrator claim authorization.
# ABOUTME: Records fail-closed denial before any instance authority transfer can execute.
Change-Id: CHG-01M1G5H8QN3B7D9E2F4K6M0P1R
Title: "Configured administrator claim authority"
Type: fix
Scope: access
Summary: "Configured instance-administrator claims now carry an explicit bootstrap-authority classification and require an exact deployment-owned provider binding before any authority-transfer state change can execute."
Group: authorization-surface
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/SECURITY-MODEL.md
    Disposition: not-applicable
    Detail: >-
      The command was never a public compatibility contract; the change closes
      an unclassified internal mutation surface during pre-release development.
  Security:
    Reference: docs/SECURITY_OVERVIEW.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Missing, unavailable, or mismatched provider bindings stop before the
      authority-transfer path, while conflicting completed claims retain the
      original administrator and commit no writes or post-commit effects.
  Migration:
    Reference: docs/RELEASE_RUNBOOK.md
    Disposition: not-applicable
    Detail: >-
      No persisted schema or stored authorization state changes.
  Configuration:
    Reference: docs/CONFIGURATION.md
    Disposition: not-applicable
    Detail: >-
      No deployment setting or provider credential changes.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
    Detail: >-
      The classified command is internal to the application layer and changes
      no HTTP route, request body, response body, or generated client.
  Operator:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      Denied configured-administrator claims fail closed without replacing an
      existing administrator or creating partial onboarding state.
