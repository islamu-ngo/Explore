# ABOUTME: Public change fragment for the sole Terminal.Gui Setup Assistant terminal target.
# ABOUTME: Records removal of the custom console workflow and the audited downstream package boundary.
Change-Id: CHG-01M1FCCYVNKA3QG7E14T0BZ493
Title: "Terminal.Gui-only setup terminal"
Type: feat
Scope: self-hosting
Summary: "Human terminal setup uses one audited Terminal.Gui target while the machine CLI remains noninteractive."
Group: setup-assistant-terminal
Supersedes: []
Impacts:
  Breaking:
    Reference: docs/OPERATIONS.md
    Disposition: documented
    Detail: >-
      The event-setup tui command and repository-native console renderer are
      removed. Human terminal operation uses Event.SetupAssistant.Terminal.
  Security:
    Reference: docs/SECRETS.md
    Disposition: documented
    Public-Disclosure: documented
    Detail: >-
      Secret entry is TTY-only, target-owned, clipboard-disabled, masked, and
      cleared across completion, cancellation, signal, failure, and disposal.
  Migration:
    Reference: docs/CI_CD_GOVERNANCE.md
    Disposition: documented
    Detail: >-
      The temporary ISLAMU.Terminal.Gui package returns to an official modular
      release only after its exact dependency closure passes the same gates.
  Configuration:
    Reference: docs/SELF_HOSTING.md
    Disposition: documented
    Detail: >-
      No new runtime setting is added. Protected terminal output currently
      requires owner-only Unix file semantics.
  OpenAPI:
    Reference: docs/API_CHANGELOG.md
    Disposition: not-applicable
    Detail: "No HTTP or OpenAPI contract changes."
  Operator:
    Reference: docs/TROUBLESHOOTING.md
    Disposition: documented
    Detail: >-
      Operators run the dedicated executable in a real TTY; redirected streams
      and unsupported protected-write platforms fail closed without fallback.
