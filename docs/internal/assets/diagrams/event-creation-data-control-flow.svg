<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" style="background-color: #121316; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>

    <!-- Box gradient & styling -->
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f242d" />
      <stop offset="100%" stop-color="#16191f" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .lifeline { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 5, 5; }
    .msg-line { stroke: #60a5fa; stroke-width: 1.5; }
    .return-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4, 4; }
    .header-box { fill: url(#box-grad); stroke: #475569; stroke-width: 1.5; rx: 6px; }
    .header-text { fill: #f8fafc; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .actor-text { fill: #f8fafc; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .msg-text { fill: #cbd5e1; font-size: 12px; font-weight: 400; }
    .msg-text-center { fill: #cbd5e1; font-size: 12px; font-weight: 400; text-anchor: middle; }
    .actor-icon { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Lifelines -->
  <line x1="80" y1="75" x2="80" y2="520" class="lifeline" />
  <line x1="220" y1="75" x2="220" y2="520" class="lifeline" />
  <line x1="380" y1="75" x2="380" y2="520" class="lifeline" />
  <line x1="520" y1="75" x2="520" y2="520" class="lifeline" />
  <line x1="670" y1="75" x2="670" y2="520" class="lifeline" />
  <line x1="830" y1="75" x2="830" y2="520" class="lifeline" />
  <line x1="970" y1="75" x2="970" y2="520" class="lifeline" />
  <line x1="1120" y1="75" x2="1120" y2="520" class="lifeline" />

  <!-- Headers -->
  <!-- 1. User Actor -->
  <g transform="translate(80, 32)">
    <circle cx="0" cy="-6" r="10" class="actor-icon" />
    <circle cx="0" cy="-8" r="4" class="actor-icon" />
    <path d="M -7 10 C -7 0, 7 0, 7 10" class="actor-icon" />
    <text x="0" y="26" class="actor-text">User (Browser)</text>
  </g>

  <!-- 2. Explore.Blazor.Client -->
  <rect x="150" y="25" width="140" height="42" class="header-box" filter="url(#shadow)" />
  <text x="220" y="46" class="header-text">Explore.Blazor.Client</text>

  <!-- 3. EventLifecycleController -->
  <rect x="305" y="25" width="150" height="42" class="header-box" filter="url(#shadow)" />
  <text x="380" y="46" class="header-text">EventLifecycleController</text>

  <!-- 4. MediatR Pipeline -->
  <rect x="465" y="25" width="110" height="42" class="header-box" filter="url(#shadow)" />
  <text x="520" y="46" class="header-text">MediatR Pipeline</text>

  <!-- 5. CreateEventCommandHandler -->
  <rect x="585" y="25" width="170" height="42" class="header-box" filter="url(#shadow)" />
  <text x="670" y="46" class="header-text">CreateEventCommandHandler</text>

  <!-- 6. CreateEventDtoValidator -->
  <rect x="765" y="25" width="150" height="42" class="header-box" filter="url(#shadow)" />
  <text x="840" y="46" class="header-text">CreateEventDtoValidator</text>

  <!-- 7. EventRepository -->
  <rect x="920" y="25" width="110" height="42" class="header-box" filter="url(#shadow)" />
  <text x="975" y="46" class="header-text">EventRepository</text>

  <!-- 8. ExploreDbContext (PostgreSQL) -->
  <rect x="1040" y="25" width="150" height="42" class="header-box" filter="url(#shadow)" />
  <text x="1115" y="46" class="header-text">ExploreDbContext</text>

  <!-- Messages -->

  <!-- Message 1: User -> Client (Submit form) -->
  <text x="150" y="103" class="msg-text-center">Submit form</text>
  <line x1="80" y1="110" x2="218" y2="110" class="msg-line" marker-end="url(#arrow-solid)" />

  <!-- Message 2: Client -> Controller (POST /api/eventlifecycle) -->
  <text x="300" y="143" class="msg-text-center">POST /api/eventlifecycle (CreateEventDraftRequestDto)</text>
  <line x1="220" y1="150" x2="378" y2="150" class="msg-line" marker-end="url(#arrow-solid)" />

  <!-- Message 3: Controller -> MediatR (Send CreateEventCommand) -->
  <text x="450" y="183" class="msg-text-center">Send(new CreateEventCommand { EventDto = draft.ToCreateEventDto() })</text>
  <line x1="380" y1="190" x2="518" y2="190" class="msg-line" marker-end="url(#arrow-solid)" />

  <!-- Message 4: MediatR -> Handler (Handle command) -->
  <text x="595" y="223" class="msg-text-center">Handle(command, ct)</text>
  <line x1="520" y1="230" x2="668" y2="230" class="msg-line" marker-end="url(#arrow-solid)" />

  <!-- Message 5: Handler -> Validator (Instantiate & validate) -->
  <text x="750" y="263" class="msg-text-center">Instantiate &amp; validate (new CreateEventDtoValidator(...))</text>
  <line x1="670" y1="270" x2="828" y2="270" class="msg-line" marker-end="url(#arrow-solid)" />

  <!-- Message 6: Validator -> Handler (ValidationResult) -->
  <text x="750" y="303" class="msg-text-center">ValidationResult (Valid)</text>
  <line x1="830" y1="310" x2="672" y2="310" class="return-line" marker-end="url(#arrow-return)" />

  <!-- Message 7: Handler -> Repo (Map DTO to entity & AddAsync) -->
  <text x="820" y="343" class="msg-text-center">Map DTO to Event entity graph &amp; AddAsync(event)</text>
  <line x1="670" y1="350" x2="968" y2="350" class="msg-line" marker-end="url(#arrow-solid)" />

  <!-- Message 8: Handler -> DbContext (SaveChangesAsync) -->
  <text x="895" y="383" class="msg-text-center">SaveChangesAsync() [Event + OutboxMessage committed atomically]</text>
  <line x1="670" y1="390" x2="1118" y2="390" class="msg-line" marker-end="url(#arrow-solid)" />

  <!-- Message 9: Handler -> Controller (Return BaseCommandResponse) -->
  <text x="525" y="423" class="msg-text-center">Return BaseCommandResponse&lt;Guid&gt;(eventId)</text>
  <line x1="670" y1="430" x2="382" y2="430" class="return-line" marker-end="url(#arrow-return)" />

  <!-- Message 10: Controller -> Client (201 CreatedAtRoute) -->
  <text x="300" y="463" class="msg-text-center">201 CreatedAtRoute with HAL _links</text>
  <line x1="380" y1="470" x2="222" y2="470" class="return-line" marker-end="url(#arrow-return)" />

</svg>
