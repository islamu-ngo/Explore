      path: api-reference
      icon: terminal
      children:
        - type: space
          key: space-3
          title: API Reference
          path: api-reference
          default: true
          content:
            directory: ./api-reference
    - type: section
      key: section-4
      title: Changelog
      path: changelog
      icon: clock-rotate-left
      children:
        - type: space
          key: space-4
          title: ISLAMU Event Release Notes
          path: changelog
          default: true
          content:
            directory: ./changelog
    - type: section
      key: section-5
      title: Help Center
      path: help-center
      icon: life-ring
      children:
        - type: space
          key: space-5
          title: ISLAMU Event Help Center
          path: help-center
          default: true
