# ABOUTME: Records the anonymized weighted Phase 7 add-on adversarial review.
# ABOUTME: Captures resolved invariant-breakers, evidence, dispositions, and closure vote.

schema_version: 1
phase: 7
anonymized: true
identity_attribution_count: 0
unresolved_critical_count: 0
decision: pass

proposals:
  - proposal: A
    weight: 0.60
    vote: pass_with_resolved_findings
  - proposal: B
    weight: 0.25
    vote: pass_with_resolved_findings
  - proposal: C
    weight: 0.15
    vote: pass_with_resolved_findings

resolved_findings:
  - id: MAD7-001
    severity: critical
    invariant: pending provider refund never releases stock
    resolution: >-
      Refund allocation now persists PendingProvider and releases inventory
      only after provider-confirmed resolution.
    test: PartialRefundConservesValueAndFulfillmentReplayCreatesOneOutcome
  - id: MAD7-002
    severity: critical
    invariant: buyer receives the exact disclosed catalog
    resolution: >-
      Reserve requests carry the still-published catalog ID and pin its
      tenant/event lineage to the registration order.
    test: EventAddOnApiTests request-shape and EventAddOnPersistenceTests lineage
  - id: MAD7-003
    severity: high
    invariant: route order and mutated line must match
    resolution: >-
      Fulfillment and refund handlers load the route order and reject a line
      outside that exact order before repository mutation.
    test: EventAddOnApiTests generic unavailable contract
  - id: MAD7-004
    severity: high
    invariant: HAL is the sole UI action authority
    resolution: >-
      Buyer and organizer components consume the advertised action href; each
      line action is read from that embedded line's own HAL links.
    test: EventAddOnComponentTests
  - id: MAD7-005
    severity: high
    invariant: lifecycle actions require authoritative order and payment truth
    resolution: >-
      Fulfillment/refund HAL requires Confirmed order state; refund allocation
      additionally requires the exact latest Succeeded provider payment ID and
      total.
    test: EventAddOnApiTests and existing payment reconciliation contracts
  - id: MAD7-006
    severity: high
    invariant: finite inventory always uses serializable authority
    resolution: >-
      Repository lifecycle methods reject weaker ambient transactions instead
      of silently inheriting their isolation.
    test: TwoBuyersRacingForTheLastUnitProduceExactlyOneWinner
  - id: MAD7-007
    severity: high
    invariant: add-ons create no implicit platform fee
    resolution: >-
      Fee calculation and validation are bounded by ticket-line value while
      add-on value remains organizer-directed.
    test: BuyerMaySelectZeroOneOrSeveralItemsWithLiteralIndependentTotals
  - id: MAD7-008
    severity: medium
    invariant: buyer sees selectable purchase and refund quantities
    resolution: >-
      Public DTOs disclose maximum selectable and maximum refundable
      quantities; controls clamp or hide actions accordingly.
    test: EventAddOnApiTests and EventAddOnComponentTests
  - id: MAD7-009
    severity: high
    invariant: provider truth cannot remain falsely pending
    resolution: >-
      Refunds persist PendingProvider, Confirmed, Failed, or
      ConfirmedInventoryReleasePending. Failed attempts reopen refundable
      quantity; release anomalies preserve provider truth for recovery.
    test: PartialRefundConservesValueAndFulfillmentReplayCreatesOneOutcome
  - id: MAD7-010
    severity: medium
    invariant: lifecycle timestamps are monotonic within add-on state
    resolution: >-
      inventory release cannot precede reservation and refund resolution
      cannot precede allocation.
    test: add-on Domain mutation scope
  - id: MAD7-011
    severity: high
    invariant: refund allocation requires exact captured payment evidence
    resolution: >-
      The handler requires the latest exact-total Succeeded payment, provider
      payment ID, paid-order acceptance snapshot, and completed dispatch effect
      bound to the same attempt and order.
    test: existing payment reconciliation and EventAddOnApiTests contracts
  - id: MAD7-012
    severity: high
    invariant: failed provider refund replay cannot report allocation success
    resolution: >-
      A failed operation ID returns ProviderFailed; retry requires a new
      operation ID and failed quantity is excluded from active allocation.
    test: add-on refund provider-state persistence contract
  - id: MAD7-013
    severity: high
    invariant: confirmed provider truth survives local release anomalies
    resolution: >-
      ConfirmedInventoryReleasePending is durable and retryable; recovery
      converges it to Confirmed when inventory release becomes possible.
    test: add-on refund provider-state persistence contract
  - id: MAD7-014
    severity: high
    invariant: HAL href controls every browser mutation target
    resolution: >-
      BFF service methods normalize the advertised API href to the same-origin
      BFF path; components do not reconstruct action routes from local IDs.
    test: EventAddOnComponentTests and EventAddOnBffTests
  - id: MAD7-015
    severity: critical
    invariant: add-on allocation and provider refund intent are one local commit
    resolution: >-
      The canonical RefundAttempt, dispatch outbox, and add-on allocation share
      one serializable unit of work; terminal dispatch/reconciliation evidence
      resolves the allocation idempotently.
    test: generic refund reservation contracts plus EventAddOnPersistenceTests

review_dispositions:
  - claim: historical released allocation can be re-reserved
    disposition: rejected
    reason: >-
      Any historical line allocation returns AlreadyReserved and creates no
      new allocation or stock mutation; the selection handler accepts only a
      newly Reserved result.
  - claim: different fulfillment operation ID permits duplicate fulfillment
    disposition: rejected
    reason: >-
      Fulfillment is idempotent by immutable line identity; a later operation
      converges on the single existing outcome and never delivers twice.
  - claim: Succeeded payment may be uncaptured
    disposition: rejected
    reason: >-
      PaymentAttempt Succeeded is the existing authoritative provider-
      reconciled terminal state and additionally requires SucceededAt,
      ProviderPaymentId, and exact order total.
  - claim: general RegistrationOrder chronology outside add-ons
    disposition: out_of_scope_pre_existing
    reason: >-
      The claim concerns pre-existing generic order transitions, not a Phase 7
      add-on change; add-on-specific timestamps are now monotonic.

evidence:
  - tests/Event.Persistence.IntegrationTests/EventAddOnPersistenceTests.cs
  - tests/Event.API.IntegrationTests/EventAddOnApiTests.cs
  - tests/Explore.Blazor.IntegrationTests/EventAddOnBffTests.cs
  - tests/Explore.Blazor.Client.Tests/EventAddOnComponentTests.cs
  - dev/active/event-ticketing-lifecycle/evidence/phase-7-pii-scan.json
