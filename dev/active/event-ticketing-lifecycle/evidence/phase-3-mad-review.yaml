# ABOUTME: Structured anonymized MAD review for ticketing lifecycle Phase 3.
# ABOUTME: Records weighted readiness concurrency, privacy, CQRS, and credential-fencing closure.

schema_version: 1
phase: 3
anonymized: true
review_mode: weighted_post_hoc
identity_attribution_count: 0
proposals:
  - id: proposal-a
    lens: persistence_concurrency
    weight: 0.40
    vote: pass
    invariant_breaker: ConcurrentApprovalAndRevocationConvergeToRevokedUnderAssignmentFence
  - id: proposal-b
    lens: subject_identity_and_privacy
    weight: 0.35
    vote: pass
    invariant_breaker: ProvisionalPurchaserDataCannotBecomeAdultSubjectCompletion
  - id: proposal-c
    lens: cqrs_issuance_and_check_in
    weight: 0.25
    vote: pass
    invariant_breaker: RevocationIsTerminalAndUsesStableOutcome
findings:
  - id: phase3-finding-001
    severity: critical
    status: resolved
    category: admission_lock_order_inversion
    evidence: Check-in now acquires participant-assignment readiness before the admission-ticket fence, matching revocation
  - id: phase3-finding-002
    severity: critical
    status: resolved
    category: unrelated_consent_reuse
    evidence: Subject consent must belong to the order's pinned registration workflow and linked subject
  - id: phase3-finding-003
    severity: major
    status: resolved
    category: erasure_foreign_key_and_resurrection
    evidence: User erasure clears subject readiness and canonical consent references before participant unlink
  - id: phase3-finding-004
    severity: major
    status: resolved
    category: provisional_purchaser_authority
    evidence: Completion requires finalized canonical submissions created by the linked adult subject
  - id: phase3-finding-005
    severity: major
    status: resolved
    category: ticket_requirement_scope
    evidence: Ticket-specific requirements are evaluated only when their pinned ticket type matches the assignment line
vote_weight_total: 1.00
pass_weight: 1.00
fail_weight: 0.00
unresolved_critical_count: 0
decision: pass
