# ABOUTME: Records the anonymized weighted Phase 8 recovery and deployment adversarial review.
# ABOUTME: Captures resolved fail-closed findings, evidence, and the final closure vote.

schema_version: 1
phase: 8
anonymized: true
identity_attribution_count: 0
unresolved_critical_count: 0
decision: pass

proposals:
  - proposal: A
    weight: 0.50
    vote: pass_with_resolved_findings
    lens: restored_authority_and_replay
  - proposal: B
    weight: 0.30
    vote: pass_with_resolved_findings
    lens: operator_failure_and_scheduler_takeover
  - proposal: C
    weight: 0.20
    vote: pass_with_resolved_findings
    lens: privacy_security_and_release_truthfulness

resolved_findings:
  - id: MAD8-001
    severity: critical
    invariant: failed recovery can never be interpreted as validated
    resolution: >-
      Validation now enumerates only successful post-validation states instead
      of relying on enum ordering. A mutation-strengthened regression exposed
      and closes the failed-state bypass.
    evidence: tests/Event.Domain.Recovery.MutationTests/TicketingRecoveryMutationTests.cs
  - id: MAD8-002
    severity: high
    invariant: scheduler resume failure remains safely retryable
    resolution: >-
      Durable WorkersOpen remains safe while Quartz is still in standby, and a
      repeated ReopenWorkers action now retries scheduler resume without
      requiring the state transition to run twice.
    evidence: src/Explore.Infrastructure/Recovery/TicketingRecoveryOperatorService.cs
  - id: MAD8-003
    severity: critical
    invariant: recovery manifests require server-only authenticity
    resolution: >-
      BeginRecovery resolves the instance manifest HMAC key through the
      single-source secret resolver, computes the canonical payload, compares
      SHA-256 HMAC bytes in constant time, clears key bytes, and refuses missing
      or mismatched material before persistence.
    evidence: src/Explore.Infrastructure/Recovery/TicketingRecoveryOperatorService.cs
  - id: MAD8-004
    severity: high
    invariant: restored provider ambiguity cannot be replayed blindly
    resolution: >-
      In-flight effects become Unknown at an advanced fence. Retry or
      dead-letter requires the exact tenant, effect, and fence; sales remain
      closed while any Unknown or credential reissue remains.
    evidence: src/Explore.Persistence/Repositories/TicketingRecoveryRepository.cs
  - id: MAD8-005
    severity: high
    invariant: implementation evidence cannot imply production approval
    resolution: >-
      Every implemented ticketing capability remains test-only while external
      gates are open, and protected delayed payout is disabled with no
      executable surface.
    evidence: src/Explore.Infrastructure/Deployment/ticketing-capabilities.json

evidence:
  - dev/active/event-ticketing-lifecycle/evidence/phase-8-pii-scan.json
  - dev/active/event-ticketing-lifecycle/evidence/phase-8-mutation-summary.json
  - tests/Event.Persistence.IntegrationTests/TicketingLifecycleRecoveryInvariantTests.cs
  - tests/Explore.Secrets.UnitTests/TicketingRecoveryOperatorContractTests.cs
  - tests/Event.Architecture.Tests/TicketingDeploymentCapabilityMatrixTests.cs
