# ABOUTME: Records the reproducible Domain mutation scope for ticketing lifecycle Phase 7.
# ABOUTME: Binds the exact command, add-on source focus, report, and strict score threshold.

schema_version: 1
phase: 7
tool:
  package: dotnet-stryker
  version: 4.16.0
  license: Apache-2.0
test_runner: mtp
discovered_tests: 12
command: >-
  cd src/Explore.Domain && dotnet stryker
  --config-file ../../tests/Event.Domain.AddOns.MutationTests/stryker-config.json
  --test-project ../../tests/Event.Domain.AddOns.MutationTests/Event.Domain.AddOns.MutationTests.csproj
  --break-at 86 --reporter json
  --output ../../dev/active/event-ticketing-lifecycle/evidence/phase-7/domain
threshold:
  comparison: greater_than
  score: 85
domain:
  project: src/Explore.Domain/Explore.Domain.csproj
  test_project: tests/Event.Domain.AddOns.MutationTests/Event.Domain.AddOns.MutationTests.csproj
  source_focus:
    - src/Explore.Domain/EventAddOnCatalogVersion.cs
    - src/Explore.Domain/EventAddOnCatalogItem.cs
    - src/Explore.Domain/RegistrationOrderAddOnLine.cs
    - src/Explore.Domain/EventAddOnInventoryAllocation.cs
    - src/Explore.Domain/EventAddOnFulfillment.cs
    - src/Explore.Domain/EventAddOnRefundAllocation.cs
    - src/Explore.Domain/EventAddOnResults.cs
    - src/Explore.Domain/RegistrationOrder.cs
  report: dev/active/event-ticketing-lifecycle/evidence/phase-7/domain/reports/mutation-report.json
  ignored_mutation_types:
    - string
  ignored_mutation_rationale: >-
    Error and disclosure prose is not a machine-consumed contract and repository
    test discipline forbids pinning prose; behavioral string validation remains
    covered without asserting exception wording.
test_integrity:
  skipped_tests: 0
  copied_tests: 0
  fixed_sleeps: 0
